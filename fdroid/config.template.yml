repo_name: LuHm OS Public Repository
repo_description: >-
  Public custom F-Droid repository for signed LuHm OS Android releases.
  The stock Samsung release is art.eggiebagelface.luhmos and does not
  require root, Termux, AcodeX, VNC, Secure Folder, or an external daemon.
repo_url: https://fdroid.eggiebagelface.art/fdroid/repo/

repo_keyalias: luhmos-fdroid-repo
keystore: {env: FDROID_KEYSTORE}
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEY_PASS}
keydname: CN=LuHm OS F-Droid Repo, O=Eggie Bagelface Art, C=US

archive_older: 2
make_current_version_link: true

# Public bootstrap mirror after a successful signed publication:
# https://raw.githubusercontent.com/eggie-admin/hydra-shell-android/fdroid-public/fdroid/repo/
#
# No private signing material belongs in this file, Git, APKs, CI artifacts,
# web roots, prompts, screenshots, or model context. The actual keystore path
# and passwords are supplied only by the trusted signing environment.
