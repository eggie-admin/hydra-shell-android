# KAI 9000 F-Droid static origin
# Intended hostname: fdroid.eggiebagelface.art
# TLS is terminated here with an origin certificate while Cloudflare uses Full (strict).
# The public repository files live at /srv/kai9000/fdroid/.

server {
    listen [::]:80;
    server_name fdroid.eggiebagelface.art;
    return 301 https://$host$request_uri;
}

server {
    listen [::]:443 ssl http2;
    server_name fdroid.eggiebagelface.art;

    ssl_certificate     /etc/kai9000/tls/origin-p256-fullchain.pem;
    ssl_certificate_key /etc/kai9000/tls/origin-p256.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KAI9000TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # Read-only F-Droid endpoint. No PUT/POST/DELETE/WebDAV.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / {
        return 302 /fdroid/repo/;
    }

    location /fdroid/repo/ {
        alias /srv/kai9000/fdroid/;
        autoindex off;
        try_files $uri =404;
        default_type application/octet-stream;

        # Repository indexes change with every release. Do not pin them for long.
        location ~* /fdroid/repo/(index.*\.(jar|json)|entry\.jar|repo-fingerprint-sha256\.txt)$ {
            alias /srv/kai9000/fdroid/$1;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
        }

        # Versioned APK filenames are immutable once published.
        location ~* /fdroid/repo/(.+\.apk)$ {
            alias /srv/kai9000/fdroid/$1;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    access_log /var/log/nginx/kai9000-fdroid-access.log;
    error_log  /var/log/nginx/kai9000-fdroid-error.log warn;
}
