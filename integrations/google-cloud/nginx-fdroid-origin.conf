# KAI 9000 F-Droid static origin
# Canonical v2: loopback-only behind dedicated Cloudflare Tunnel.
# No public listener, no local TLS requirement, no direct WAN path.
# Public repository files live at /srv/kai9000/fdroid/.

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # Read-only F-Droid endpoint. No PUT/POST/DELETE/WebDAV.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / {
        return 302 /fdroid/repo/;
    }

    location /fdroid/repo/ {
        alias /srv/kai9000/fdroid/;
        autoindex off;
        try_files $uri =404;
        default_type application/octet-stream;

        # Repository indexes change with every release.
        location ~* /fdroid/repo/(index.*\.(jar|json)|entry\.jar|repo-fingerprint-sha256\.txt)$ {
            alias /srv/kai9000/fdroid/$1;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
        }

        # Versioned APK filenames are immutable once published.
        location ~* /fdroid/repo/(.+\.apk)$ {
            alias /srv/kai9000/fdroid/$1;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    access_log /var/log/nginx/kai9000-fdroid-access.log;
    error_log  /var/log/nginx/kai9000-fdroid-error.log warn;
}
