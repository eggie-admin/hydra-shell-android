# Template only. Do not commit a real tunnel credential or certificate path.
# Preferred WAN-to-LAN/public origin connector for KAI 9000.

tunnel: ${CF_TUNNEL_ID}
credentials-file: ${CF_TUNNEL_CREDENTIALS_FILE}

protocol: quic

ingress:
  # Public business site. Origin should present a valid Let's Encrypt ECDSA cert.
  - hostname: eggiebagelface.art
    service: https://127.0.0.1:8443
    originRequest:
      originServerName: eggiebagelface.art

  - hostname: www.eggiebagelface.art
    service: https://127.0.0.1:8443
    originRequest:
      originServerName: eggiebagelface.art

  # Public F-Droid repository. Keep public and do not place Access geo/identity gates here.
  - hostname: fdroid.eggiebagelface.art
    service: https://127.0.0.1:8443
    originRequest:
      originServerName: fdroid.eggiebagelface.art

  # Private admin surface. Cloudflare Access policy must protect this hostname.
  - hostname: admin.eggiebagelface.art
    service: http://127.0.0.1:8787

  # Catch-all is mandatory so undeclared hostnames never fall through to a service.
  - service: http_status:404

# Private .lan routing is configured in Cloudflare Zero Trust private-network/private-hostname
# routes, not by publishing .lan records in public authoritative DNS.
# Keep AcodeX/VNC/WebSocket loopback-only unless a separately reviewed private Access route
# is explicitly declared.
