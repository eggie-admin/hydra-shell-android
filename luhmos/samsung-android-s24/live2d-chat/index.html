<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <title>KAI 9000 Cathedral Girl</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<main id="scene" class="scene" aria-label="KAI 9000 floating 2D cathedral">
  <div class="layer layer-bg" data-depth="0.05"></div>
  <div class="layer layer-mid" data-depth="0.12"></div>
  <div class="layer layer-stage" data-depth="0.19">
    <section id="actor-left" class="actor actor-left active"><div class="live2d-slot" data-slot="left"><div class="placeholder-face"><i></i><b>L</b></div></div></section>
    <section id="actor-right" class="actor actor-right"><div class="live2d-slot" data-slot="right"><div class="placeholder-face ghost"><b>AI</b></div></div></section>
  </div>
  <div class="layer layer-front" data-depth="0.28"><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span></div>

  <section class="cockpit">
    <header class="titlebar"><span class="lights"><i></i><i></i><i></i></span><div><strong>KAI 9000 // CATHEDRAL GIRL</strong><small id="shell">NATIVE ANDROID</small></div><button id="status" type="button">STATUS</button></header>
    <aside class="providerbar"><button data-provider="auto" class="selected">AUTO</button><button data-provider="ollama">OLLAMA</button><button data-provider="edge">EDGE</button><button id="gallery" type="button">GALLERY</button><span id="ollama-pill">OLLAMA ?</span><span id="edge-pill">EDGE ?</span></aside>
    <section class="dialogue" aria-live="polite"><header><strong id="speaker">Lum</strong><span id="turn">TURN 01</span></header><p id="line">Native Cathedral shell online. No Firefox required.</p><div id="transcript" class="transcript"></div><form id="chat-form"><input id="prompt" maxlength="4000" autocomplete="off" placeholder="Talk to Lum…" /><button type="submit">SEND</button></form></section>
  </section>
</main>
<script src="./vendor/jquery.min.js"></script>
<script src="./jquery.cathedral.js"></script>
<script src="./app.js"></script>
</body>
</html>
