<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <title>LuHm OS Debug</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="scene" class="scene" aria-label="LuHm OS 2D JRPG chat scene">
    <div class="layer layer-bg" data-depth="0.08" aria-hidden="true"></div>
    <div class="layer layer-mid" data-depth="0.16" aria-hidden="true"></div>
    <div class="layer layer-actors" data-depth="0.28">
      <section id="actor-left" class="actor actor-left active" aria-label="Left character">
        <div class="live2d-slot" data-slot="left">
          <div class="placeholder-face">L</div>
        </div>
      </section>
      <section id="actor-right" class="actor actor-right" aria-label="Right character">
        <div class="live2d-slot" data-slot="right">
          <div class="placeholder-face">R</div>
        </div>
      </section>
    </div>
    <div class="layer layer-fx" data-depth="0.42" aria-hidden="true">
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
    </div>

    <section class="dialogue" aria-live="polite">
      <header class="dialogue-head">
        <strong id="speaker">Lum</strong>
        <span id="turn">TURN 01</span>
      </header>
      <p id="line">Private 2D chat shell ready.</p>
      <div class="choices" id="choices">
        <button data-line="Professor: Keep it 2D. Four layers. Clean JRPG flow.">Reply</button>
        <button data-line="Professor: Advance the scene.">Advance</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
