[project]
name = "kai-vue-cms-mutation"
version = "0.1.0"
description = "Donor-purged KAI-owned Vue CMS mutation with FastAPI backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.117.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
