name: KAI Android Official-Repo Dev Lane

on:
  workflow_dispatch:
  push:
    branches:
      - mutation/android-official-dev-lane
    paths:
      - 'android-dev/**'
      - '.github/workflows/android-official-dev-lane.yml'

permissions:
  contents: read

jobs:
  native-dev-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Source contract
        shell: bash
        run: |
          set -euo pipefail
          M='android-dev/app/src/main/AndroidManifest.xml'
          grep -q 'android.intent.action.MAIN' "$M"
          grep -q 'android.intent.category.LAUNCHER' "$M"
          ! grep -q 'android.intent.category.HOME' "$M"
          grep -q 'android:screenOrientation="portrait"' "$M"
          grep -q 'android:excludeFromRecents="false"' "$M"
          grep -q 'compileSdk = 36' android-dev/app/build.gradle.kts
          grep -q 'targetSdk = 36' android-dev/app/build.gradle.kts
          echo ANDROID_OFFICIAL_DEV_SOURCE_GREEN

      - name: Build native dev APK
        run: gradle -p android-dev :app:assembleDebug --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-dev/app/build/outputs/apk/debug/app-debug.apk'
          TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          test -s "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee android-dev/badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | tee android-dev/manifest.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee android-dev/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          sha256sum "$APK" | tee android-dev/sha256.txt
          grep -q "package: name='art.eggiebagelface.kai9000.devhost.debug'" android-dev/badging.txt
          grep -q 'launchable-activity:' android-dev/badging.txt
          grep -q 'android.hardware.screen.portrait' android-dev/badging.txt
          ! grep -q 'android.intent.category.HOME' android-dev/manifest.txt
          echo ANDROID_OFFICIAL_DEV_APK_GREEN

      - uses: actions/upload-artifact@v4
        with:
          name: kai9000-android-official-dev-${{ github.run_number }}
          path: |
            android-dev/app/build/outputs/apk/debug/app-debug.apk
            android-dev/badging.txt
            android-dev/manifest.txt
            android-dev/signature.txt
            android-dev/sha256.txt
          if-no-files-found: error
          retention-days: 14
