name: KAI 9000 Witching Hour ULTIMA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/KAI9000_FINAL_MILESTONE_1.0.0.json'
      - 'release/KAI9000_WITCHING_HOUR_10PASS_20260907.json'
      - '.github/workflows/kai9000-final-release.yml'

permissions:
  contents: read

concurrency:
  group: kai9000-witching-hour-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: 903de4857f7554067a9cbfd2912202632f62c459
  PACKAGE_ID: art.eggiebagelface.kai9000
  VERSION_NAME: 1.0.0
  VERSION_CODE: '100'
  APK_NAME: kai9000-1.0.0-staging.apk
  NPM_LOCK_SHA256: 7929d5c53793563492ff0f5b39278904ecfa5508b10071d5b6d4b0b268fe653c
  RELEASE_CERT_SHA256: 2a318812c5507548b31aa6430cd7ab29ca9e8b0afc4f1218e939242218d9bffe
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  ANDROID_GRADLE_VERSION: 8.11.1
  ANDROID_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

jobs:
  doctrine:
    name: Witching Hour doctrine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify 10-pass release doctrine and repository guards
        shell: bash
        run: |
          set -euo pipefail
          python tools/kai9000_ci_guard.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          final=json.loads(Path('release/KAI9000_FINAL_MILESTONE_1.0.0.json').read_text())
          audit=json.loads(Path('release/KAI9000_WITCHING_HOUR_10PASS_20260907.json').read_text())
          assert final['schema']=='kai9000.final-release.v2'
          assert audit['schema']=='kai9000.witching-hour.audit.v1'
          assert final['release']['package_id']==os.environ['PACKAGE_ID']
          assert final['release']['version_name']==os.environ['VERSION_NAME']
          assert final['release']['version_code']==int(os.environ['VERSION_CODE'])
          assert final['source']['donor_ref']==os.environ['DONOR_REF']==audit['source']['donor_ref']
          assert final['signing']['final_certificate_sha256']==os.environ['RELEASE_CERT_SHA256']
          assert final['signing']['private_key_in_git'] is False
          assert final['signing']['private_key_in_drive'] is False
          passes={p['pass']:p['status'] for p in audit['passes']}
          assert all(passes[n]=='GREEN' for n in range(1,10))
          assert passes[10]=='YELLOW'
          assert audit['definition']['deterministic_ci_is_authority'] is True
          assert audit['definition']['ai_review_can_override_failed_machine_gate'] is False
          assert audit['ai_chain']['mode']=='single_model_multi_role_review'
          assert audit['ai_chain']['independent_model_consensus'] is False
          assert audit['ai_chain']['signoff']=='APPROVED_WITH_GOVERNANCE_EXCEPTIONS'
          assert audit['overall']['governance']=='YELLOW'
          print('KAI9000_WITCHING_HOUR_DOCTRINE_GREEN')
          PY

  apk:
    name: KAI 9000 1.0.0 hardened forge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout LuHm OS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Checkout pinned hardened donor
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/kai9000
          persist-credentials: false
      - name: Verify release package and hard boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='_forge/kai9000'
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('_forge/kai9000/release/version.json').read_text())
          assert d=={'packageId':'art.eggiebagelface.kai9000','version':'1.0.0','pythonVersion':'1.0.0','versionCode':100}
          PY
          grep -q 'name="Android Release"' "$ROOT/godot/export_presets.cfg"
          grep -q 'package/unique_name="art.eggiebagelface.kai9000"' "$ROOT/godot/export_presets.cfg"
          grep -q 'package/name="KAI 9000"' "$ROOT/godot/export_presets.cfg"
          grep -q 'APP_VERSION = "1.0.0"' "$ROOT/server/app/main.py"
          grep -q 'FastAPI(title="KAI 9000 Control"' "$ROOT/server/app/main.py"
          grep -q 'kai9000Cockpit' "$ROOT/apps/forge-ui/src/main.ts"
          grep -q 'android:exported="false"' "$ROOT/godot/android-plugin/plugin/src/main/AndroidManifest.xml"
          grep -q 'cleartextTrafficPermitted="false"' "$ROOT/godot/android-plugin/plugin/src/main/res/xml/cathedral_network_security.xml"
          grep -q '>127.0.0.1<' "$ROOT/godot/android-plugin/plugin/src/main/res/xml/cathedral_network_security.xml"
          grep -q 'allowFileAccess = false' "$ROOT/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt"
          grep -q 'allowContentAccess = false' "$ROOT/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt"
          grep -q 'arrayOf(command)' "$ROOT/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralWidgetProvider.kt"
          if grep -q 'Runtime.getRuntime().exec' "$ROOT/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralWidgetProvider.kt"; then exit 1; fi
          echo 'KAI9000_HARD_BOUNDARIES_GREEN'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'
      - name: Install verified Godot and pinned Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/kai9000-cache"
          WORK="$RUNNER_TEMP/kai9000-godot"
          mkdir -p "$CACHE" "$WORK"
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/templates.tpz" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/gradle.zip" "https://services.gradle.org/distributions/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          echo "${ANDROID_GRADLE_SHA256}  $CACHE/gradle.zip" | sha256sum --check --strict
          unzip -q "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          unzip -q "$CACHE/templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          PATCH="$WORK/android-source"
          mkdir -p "$PATCH"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH"
          WRAPPER="$(find "$PATCH" -type f -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          test -n "$WRAPPER"
          python - "$WRAPPER" "$CACHE/gradle.zip" "$ANDROID_GRADLE_SHA256" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); uri=Path(sys.argv[2]).resolve().as_uri(); digest=sys.argv[3]
          lines=p.read_text().splitlines(); out=[]; saw=False
          for line in lines:
              if line.startswith('distributionUrl='): out.append('distributionUrl='+uri)
              elif line.startswith('distributionSha256Sum='): out.append('distributionSha256Sum='+digest); saw=True
              else: out.append(line)
          if not saw: out.append('distributionSha256Sum='+digest)
          p.write_text('\n'.join(out)+'\n')
          PY
          rm -f "$TEMPLATE_DIR/android_source.zip"
          (cd "$PATCH" && zip -q -r "$TEMPLATE_DIR/android_source.zip" .)
      - name: Build bundled jQuery cockpit from committed lock
        working-directory: _forge/kai9000/apps
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --no-audit --no-fund
          echo "${NPM_LOCK_SHA256}  package-lock.json" | sha256sum --check --strict
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace=video-forge-ui
          test -f forge-ui/dist/index.html
          grep -R -q 'KAI 9000' forge-ui/dist
      - name: Build plugin and execute hard architecture gates
        working-directory: _forge/kai9000
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p godot/android-plugin/plugin/src/main/assets/cms
          cp -a apps/forge-ui/dist/. godot/android-plugin/plugin/src/main/assets/cms/
          gradle -p godot/android-plugin :plugin:assemble
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar
          rm -rf godot/addons/CathedralAndroid
          mkdir -p godot/addons/CathedralAndroid/bin/debug godot/addons/CathedralAndroid/bin/release
          cp -a godot/android-plugin/plugin/export_scripts_template/. godot/addons/CathedralAndroid/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar godot/addons/CathedralAndroid/bin/debug/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar godot/addons/CathedralAndroid/bin/release/
          python scripts/architecture_sanity.py
          python scripts/cathedral_full_sanity.py
          python scripts/samsung_edge_sanity.py
      - name: Configure staging-only signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          KEYSTORE="$RUNNER_TEMP/kai9000-staging.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=KAI 9000 Staging,O=LuHm OS,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Export hardened release candidate
        working-directory: _forge/kai9000
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path godot --quit
          "$GODOT_BIN" --headless --path godot --install-android-build-template --export-debug 'Android Release' "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          test -s "$GITHUB_WORKSPACE/build/android/$APK_NAME"
      - name: Verify APK identity signature ABI CMS and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee build/android/zipalign.txt
          "$TOOLS/aapt" dump badging "$APK" | tee build/android/badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | tee build/android/manifest.txt
          unzip -l "$APK" | tee build/android/contents.txt
          sha256sum "$APK" | tee build/android/sha256.txt
          grep -q "package: name='$PACKAGE_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" build/android/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/android/signature.txt
          grep -q 'lib/arm64-v8a/' build/android/contents.txt
          if grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' build/android/contents.txt; then exit 1; fi
          grep -q 'assets/cms/index.html' build/android/contents.txt
          grep -q 'art.eggiebagelface.cathedral.CathedralWidgetProvider' build/android/manifest.txt
          grep -q 'com.termux.permission.RUN_COMMAND' build/android/manifest.txt
          echo 'KAI9000_HARDENED_APK_GREEN'
      - name: Upload hardened candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kai9000-witching-hour-candidate-${{ github.run_number }}
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/manifest.txt
            build/android/contents.txt
          if-no-files-found: error
          retention-days: 14

  fdroid:
    name: KAI 1.0.0 hardened F-Droid staging
    needs: [apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/kai9000
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: kai9000-witching-hour-candidate-${{ github.run_number }}
          path: build/apk
      - name: Stage private F-Droid input
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/apk -name '*.apk' -print -quit)"
          test -s "$APK"
          python _forge/kai9000/scripts/stage_fdroid_repo.py --apk "$APK" --output build/fdroid --package "$PACKAGE_ID" --version-code "$VERSION_CODE"
          test -s "build/fdroid/repo/${PACKAGE_ID}_${VERSION_CODE}.apk"
          test -s "build/fdroid/metadata/${PACKAGE_ID}.yml"
          echo 'KAI9000_HARDENED_FDROID_GREEN'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kai9000-witching-hour-fdroid-${{ github.run_number }}
          path: build/fdroid/**
          if-no-files-found: error
          retention-days: 14

  ai_record:
    name: AI chain sign-off record
    needs: [doctrine, apk, fdroid]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Validate recorded AI review chain cannot override CI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('release/KAI9000_WITCHING_HOUR_10PASS_20260907.json').read_text())
          a=d['ai_chain']
          assert d['definition']['deterministic_ci_is_authority'] is True
          assert d['definition']['ai_review_can_override_failed_machine_gate'] is False
          assert a['mode']=='single_model_multi_role_review'
          assert a['model']=='GPT-5.6 Sol'
          assert a['independent_model_consensus'] is False
          assert [r['role'] for r in a['roles']]==['architect','adversarial_reviewer','release_judge']
          assert a['signoff']=='APPROVED_WITH_GOVERNANCE_EXCEPTIONS'
          print('KAI9000_AI_CHAIN_RECORD_GREEN')
          PY

  ultima:
    name: KAI 9000 Witching Hour Final ULTIMA
    if: always()
    needs: [doctrine, apk, fdroid, ai_record]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every technical gate green
        env:
          DOCTRINE: ${{ needs.doctrine.result }}
          APK: ${{ needs.apk.result }}
          FDROID: ${{ needs.fdroid.result }}
          AI_RECORD: ${{ needs.ai_record.result }}
        run: |
          set -euo pipefail
          printf 'Doctrine=%s APK=%s F-Droid=%s AI-record=%s\n' "$DOCTRINE" "$APK" "$FDROID" "$AI_RECORD"
          test "$DOCTRINE" = success
          test "$APK" = success
          test "$FDROID" = success
          test "$AI_RECORD" = success
          echo 'KAI9000_WITCHING_HOUR_ULTIMA_GREEN'
