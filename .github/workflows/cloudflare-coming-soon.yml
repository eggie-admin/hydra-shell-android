name: LuHm OS Cloudflare Edge

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish
      confirm_publish:
        description: Type YES only when binding eggiebagelface.art is intended
        required: false
        default: NO
        type: string
  pull_request:
    branches:
      - luhmos-main
    paths:
      - 'site/coming-soon/**'
      - '.github/workflows/cloudflare-coming-soon.yml'
      - 'integrations/enterprise-api.posture.json'
      - 'tools/enterprise_api_posture_guard.py'

permissions:
  contents: read

concurrency:
  group: luhmos-cloudflare-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public edge boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Public/private boundary invariants
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC=site/coming-soon/public
          test -s "$PUBLIC/index.html"
          test -s "$PUBLIC/robots.txt"
          test -s "$PUBLIC/_headers"
          test -s site/coming-soon/wrangler.preview.jsonc
          test -s site/coming-soon/wrangler.production.jsonc

          unexpected="$(find "$PUBLIC" -maxdepth 1 -type f -printf '%f\n' | sort | grep -vE '^(index\.html|robots\.txt|_headers)$' || true)"
          test -z "$unexpected" || { echo "Unexpected public asset(s):"; printf '%s\n' "$unexpected"; exit 1; }

          grep -q 'LuHm OS' "$PUBLIC/index.html"
          grep -q 'eggiebagelface.art' "$PUBLIC/index.html"
          grep -q 'noindex,nofollow,noarchive,nosnippet,noimageindex' "$PUBLIC/index.html"
          grep -q 'Content-Security-Policy:' "$PUBLIC/_headers"
          grep -q 'X-Frame-Options: DENY' "$PUBLIC/_headers"
          grep -q 'Permissions-Policy:' "$PUBLIC/_headers"
          grep -q 'X-Robots-Tag: noindex' "$PUBLIC/_headers"

          ! grep -RniE '<script|<form|<iframe|<object|<embed|javascript:|href=|src=|https?://' "$PUBLIC"
          ! grep -RniE 'localhost|127\.0\.0\.1|\.lan([/[:space:]]|$)|/admin|/dev|/api' "$PUBLIC"
          ! grep -RniE 'OPENAI_API_KEY|HF_TOKEN|CLOUDFLARE_API_TOKEN|CF_API_TOKEN|BEGIN [A-Z ]*PRIVATE KEY|Authorization:[[:space:]]*Bearer|\$\{\{[[:space:]]*secrets\.' "$PUBLIC"
          ! find "$PUBLIC" -type f -name '*.map' -print -quit | grep -q .

          grep -q '"pattern": "eggiebagelface.art"' site/coming-soon/wrangler.production.jsonc
          grep -q '"pattern": "www.eggiebagelface.art"' site/coming-soon/wrangler.production.jsonc
          ! grep -q 'fdroid.eggiebagelface.art' site/coming-soon/wrangler.production.jsonc

          echo 'LUHM_PUBLIC_PRIVATE_BOUNDARY_GREEN'

  deploy:
    name: Cloudflare manual deploy
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Credential and publish authority guard
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm_publish }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$TARGET" = publish ]; then
            test "$CONFIRM" = YES
          fi

      - name: Verify Cloudflare account service principal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          printf '%s' "$response" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          result = payload.get("result") or {}
          if payload.get("success") is not True or result.get("status") != "active":
              raise SystemExit("CLOUDFLARE_ACCOUNT_TOKEN_NOT_ACTIVE")
          '
          echo 'CLOUDFLARE_ACCOUNT_SERVICE_PRINCIPAL_GREEN'

      - name: Deploy preview
        if: inputs.target == 'preview'
        working-directory: site/coming-soon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.preview.jsonc

      - name: Publish eggiebagelface.art
        if: inputs.target == 'publish'
        working-directory: site/coming-soon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.production.jsonc
