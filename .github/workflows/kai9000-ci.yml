name: KAI9000 Cathedral CI

on:
  pull_request:
    paths:
      - "project/hydra/**"
      - "lumh-os/kai9000/**"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "backend/**"
      - "tools/**"
      - "integrations/**"
      - "docs/**"
      - "README.md"
      - "SUPPORT.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/kai9000-ci.yml"
      - ".github/workflows/luhmos-main-release-launch.yml"
      - ".github/workflows/luhmos-fdroid-public-release.yml"
      - ".github/workflows/luhmos-github-release.yml"
      - ".github/workflows/luhmos-izzy-github-release.yml"
      - ".github/workflows/luhmos-public-release-lock-guard.yml"
      - ".github/workflows/cloudflare-coming-soon.yml"
      - ".github/workflows/google-white-magic-strict-free-vm.yml"
      - ".github/workflows/luhmos-deploy-authority-lock-guard.yml"
      - ".github/workflows/luhmos-canonical-branch-governance-audit.yml"
  push:
    branches: [luhmos-main]
    paths:
      - "project/hydra/**"
      - "lumh-os/kai9000/**"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "backend/**"
      - "tools/**"
      - "integrations/**"
      - "docs/**"
      - "README.md"
      - "SUPPORT.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/kai9000-ci.yml"
      - ".github/workflows/luhmos-main-release-launch.yml"
      - ".github/workflows/luhmos-fdroid-public-release.yml"
      - ".github/workflows/luhmos-github-release.yml"
      - ".github/workflows/luhmos-izzy-github-release.yml"
      - ".github/workflows/luhmos-public-release-lock-guard.yml"
      - ".github/workflows/cloudflare-coming-soon.yml"
      - ".github/workflows/google-white-magic-strict-free-vm.yml"
      - ".github/workflows/luhmos-deploy-authority-lock-guard.yml"
      - ".github/workflows/luhmos-canonical-branch-governance-audit.yml"

permissions:
  contents: read

jobs:
  policy-fastpath:
    name: LuHm policy fastpath
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Static authority and API-spine guards
        run: |
          python tools/project_hydra_structure_guard.py
          python tools/kai9000_ci_guard.py
          python tools/remote_assistance_guard.py
          python tools/runtime_capability_guard.py
          python tools/retired_lane_guard.py
          python tools/public_release_lock_guard.py
          python tools/deploy_authority_guard.py
      - name: Python syntax gate
        run: |
          python -m compileall -q ultima/ollama-ffmpeg-antenna-v3
          python -m py_compile tools/kai9000_ci_guard.py tools/project_hydra_structure_guard.py tools/remote_assistance_guard.py tools/remote_assistance_bench.py tools/runtime_capability_guard.py tools/retired_lane_guard.py tools/public_release_lock_guard.py tools/deploy_authority_guard.py tools/canonical_branch_governance_audit.py

  api-spine-runtime:
    name: LuHm API spine runtime
    needs: policy-fastpath
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ultima/ollama-ffmpeg-antenna-v3/pyproject.toml
      - name: Install remote runtime and tests
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pip install -e . pytest
      - name: Deterministic routing benchmark
        run: python tools/remote_assistance_bench.py
      - name: Remote assistance unit contract
        run: python -m pytest -q backend/tests/test_remote_ai_router.py backend/tests/test_remote_assistance.py backend/tests/test_google_assist.py

  cathedral-runtime:
    name: LuHm Cathedral runtime
    needs: policy-fastpath
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ultima/ollama-ffmpeg-antenna-v3/pyproject.toml
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ultima/ollama-ffmpeg-antenna-v3/package-lock.json
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install KAI9000 Python runtime
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pip install -e . pytest
      - name: Lum Crown authority contract
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pytest -q tests/test_lum_agent.py
      - name: Locked jQuery vendor gate
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: |
          npm ci --prefer-offline
          npm run vendor:jquery
          test -s static/vendor/jquery.min.js
      - name: npm metadata gate
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: npm pkg get name version scripts dependencies
      - name: Runtime doctor
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: npm run doctor
      - name: No-network smoke tests
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m unittest discover -s tests -p "test_ci_*.py" -v
