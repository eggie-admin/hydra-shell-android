name: LuHm OS Legacy Donor Audit

on:
  pull_request:
    paths:
      - "lumh-os/kai9000/**"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "tools/kai9000_ci_guard.py"
      - ".github/workflows/kai9000-ci.yml"
  push:
    branches: [luhmos-main]
    paths:
      - "lumh-os/kai9000/**"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "tools/kai9000_ci_guard.py"
      - ".github/workflows/kai9000-ci.yml"

permissions:
  contents: read

jobs:
  donor-audit:
    name: Legacy KAI donor compatibility audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install FFmpeg for donor tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install legacy donor runtime test dependencies
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Audit legacy donor architecture and secrets
        run: python tools/kai9000_ci_guard.py

      - name: Compile donor Python
        run: |
          python -m compileall -q ultima/ollama-ffmpeg-antenna-v3
          python -m py_compile tools/kai9000_ci_guard.py

      - name: Verify donor Lum authority contract
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pytest -q tests/test_lum_agent.py

      - name: Verify locked jQuery donor dependency
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: |
          npm ci
          npm run vendor:jquery
          test -s static/vendor/jquery.min.js

      - name: Donor runtime metadata
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: npm pkg get name version scripts dependencies

      - name: Donor runtime doctor
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: npm run doctor

      - name: Donor no-network smoke tests
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m unittest discover -s tests -p "test_ci_*.py" -v

      - name: Donor boundary receipt
        shell: bash
        run: |
          set -euo pipefail
          echo 'KAI9000_ROLE=DONOR_REFERENCE_ONLY'
          echo 'LUHM_OS_AUTHORITY=NOT_GRANTED_BY_THIS_WORKFLOW'
          echo 'LUHM_OS_LEGACY_DONOR_AUDIT_GREEN'
