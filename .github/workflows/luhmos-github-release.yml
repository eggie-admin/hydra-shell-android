name: LuHm OS GitHub Beta Publisher

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      version_name:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      acknowledge_public_beta_release:
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  dispatch-registration-only:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Default-branch dispatch registration only. Canonical workflow executes from requested ref.'
