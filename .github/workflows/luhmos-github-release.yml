name: LuHm OS GitHub Beta Publisher

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful LuHm OS Signed Beta Candidate workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact signed-candidate artifact name
        required: true
        type: string
      release_sha:
        description: Exact luhmos/beta source SHA embedded in the candidate
        required: true
        type: string
      version_name:
        description: Android beta version name
        required: true
        type: string
        default: 1.0.1-beta.1
      tag_name:
        description: New GitHub prerelease tag
        required: true
        type: string
        default: v1.0.1-beta.1
      acknowledge_public_beta_release:
        description: Publish this verified signed candidate as a public GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: luhmos-public-beta-publisher
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Verify enterprise candidate and publish immutable prerelease
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce publisher Crown boundary
        shell: bash
        env:
          ACK: ${{ inputs.acknowledge_public_beta_release }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/luhmos-main'
          test "$ACK" = 'true'
          echo 'LUHMOS_PUBLISHER_SIGNING_SECRETS=NONE'
          echo 'LUHMOS_PUBLIC_BETA_AUTHORITY=EXPLICIT'

      - name: Checkout publisher policy only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release inputs and beta head
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$TAG_NAME" = "v$VERSION_NAME"
          git fetch --no-tags origin refs/heads/luhmos/beta:refs/remotes/origin/luhmos/beta
          test "$(git rev-parse refs/remotes/origin/luhmos/beta)" = "$RELEASE_SHA"

      - name: Prove source signer workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = 'LuHm OS Signed Beta Candidate'
          test "$(jq -r '.event' <<<"$RUN_JSON")" = 'workflow_dispatch'
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = 'success'
          test "$(jq -r '.head_branch' <<<"$RUN_JSON")" = 'luhmos-main'
          echo 'LUHMOS_SIGNER_RUN_GREEN'

      - name: Download exact signed candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          rm -rf build/candidate
          mkdir -p build/candidate
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir build/candidate
          test -s build/candidate/release-manifest.json
          test -s build/candidate/sbom.spdx.json
          test -s build/candidate/provenance.json
          test -s build/candidate/evidence-sha256.txt

      - name: Verify APK, signer, SBOM and provenance binding
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          TAG_NAME: ${{ inputs.tag_name }}
          EXPECTED_APK_FP: ${{ vars.LUHMOS_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_APK_FP"
          MANIFEST=build/candidate/release-manifest.json
          SBOM=build/candidate/sbom.spdx.json
          PROV=build/candidate/provenance.json
          python -m json.tool "$MANIFEST" >/dev/null
          python -m json.tool "$SBOM" >/dev/null
          python -m json.tool "$PROV" >/dev/null
          test "$(jq -r '.schema' "$MANIFEST")" = 'luhm-os.signed-beta-artifact.v2'
          test "$(jq -r '.source_sha' "$MANIFEST")" = "$RELEASE_SHA"
          test "$(jq -r '.tag' "$MANIFEST")" = "$TAG_NAME"
          test "$(jq -r '.version_name' "$MANIFEST")" = "$VERSION_NAME"
          test "$(jq -r '.package' "$MANIFEST")" = 'art.eggiebagelface.luhmos'
          test "$(jq -r '.public_publish_authority' "$MANIFEST")" = 'false'
          APK_NAME="$(jq -r '.apk_name' "$MANIFEST")"
          APK_SHA="$(jq -r '.apk_sha256' "$MANIFEST")"
          APK_FP="$(jq -r '.signer_sha256' "$MANIFEST" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          WANT_FP="$(printf '%s' "$EXPECTED_APK_FP" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$APK_FP" = "$WANT_FP"
          test -s "build/candidate/$APK_NAME"
          test "$(sha256sum "build/candidate/$APK_NAME" | awk '{print $1}')" = "$APK_SHA"
          test "$(sha256sum "$SBOM" | awk '{print $1}')" = "$(jq -r '.sbom_sha256' "$MANIFEST")"
          test "$(sha256sum "$PROV" | awk '{print $1}')" = "$(jq -r '.provenance_sha256' "$MANIFEST")"
          test "$(jq -r '.spdxVersion' "$SBOM")" = 'SPDX-2.3'
          test "$(jq -r '.packages[] | select(.SPDXID=="SPDXRef-Package-LuHmOS") | .checksums[] | select(.algorithm=="SHA256") | .checksumValue' "$SBOM")" = "$APK_SHA"
          test "$(jq -r '.schema' "$PROV")" = 'luhm-os.release-provenance.v1'
          test "$(jq -r '.source_repository' "$PROV")" = 'eggie-admin/hydra-shell-android'
          test "$(jq -r '.source_branch' "$PROV")" = 'luhmos/beta'
          test "$(jq -r '.source_sha' "$PROV")" = "$RELEASE_SHA"
          test "$(jq -r '.artifact.sha256' "$PROV")" = "$APK_SHA"
          test "$(jq -r '.artifact.signer_sha256' "$PROV" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')" = "$APK_FP"
          test "$(jq -r '.canonical_forge.external_checkout' "$PROV")" = 'false'
          test "$(jq -r '.public_publish_authority' "$PROV")" = 'false'
          test -s build/candidate/signature.txt
          test -s build/candidate/zipalign.txt
          test -s build/candidate/badging.txt
          test -s build/candidate/permissions.txt
          (cd build/candidate && sha256sum --check evidence-sha256.txt)
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "APK_FP=$APK_FP" >> "$GITHUB_ENV"
          echo 'LUHMOS_ENTERPRISE_SIGNED_ARTIFACT_EVIDENCE_GREEN'

      - name: Refuse tag or release replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG_NAME" >&2
            exit 1
          fi
          echo 'LUHMOS_RELEASE_NAMESPACE_CLEAR'

      - name: Create public beta release notes
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          cat > build/candidate/release-notes.md <<EOF
          # LuHm OS $VERSION_NAME

          Public Android beta prerelease.

          - Package: \`art.eggiebagelface.luhmos\`
          - Source channel: \`luhmos/beta\`
          - Source SHA: \`$RELEASE_SHA\`
          - APK SHA-256: \`$APK_SHA\`
          - Android signer SHA-256: \`$APK_FP\`
          - SBOM: SPDX 2.3, artifact-bound
          - Provenance: source/SHA/tree/toolchain/artifact bound
          - Target: Samsung/Android, arm64-v8a, target SDK 36

          Stable promotion remains separately gated by physical Samsung install/launch and same-signer upgrade proof.
          EOF

      - name: Publish immutable GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "LuHm OS $VERSION_NAME" \
            --notes-file build/candidate/release-notes.md \
            --prerelease \
            "build/candidate/$APK_NAME#LuHm OS Android APK" \
            "build/candidate/release-manifest.json#Signed beta release manifest" \
            "build/candidate/sbom.spdx.json#SPDX 2.3 SBOM" \
            "build/candidate/provenance.json#Release provenance" \
            "build/candidate/evidence-sha256.txt#Evidence digest set" \
            "build/candidate/sha256.txt#APK SHA-256 receipt" \
            "build/candidate/signature.txt#Android signature receipt" \
            "build/candidate/zipalign.txt#16 KiB alignment receipt" \
            "build/candidate/badging.txt#Android package identity receipt" \
            "build/candidate/permissions.txt#Android permissions receipt" \
            "build/candidate/android-signer-sha256.txt#Android signer fingerprint"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,url
          echo 'LUHMOS_PUBLIC_BETA_GITHUB_RELEASE_GREEN'
