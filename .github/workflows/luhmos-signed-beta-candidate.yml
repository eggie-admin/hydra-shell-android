name: LuHm OS Signed Beta Candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact luhmos/beta commit to sign
        required: true
        type: string
      version_name:
        description: Android beta version name
        required: true
        type: string
        default: 1.0.1-beta.1
      version_code:
        description: Monotonic Android version code
        required: true
        type: string
        default: '101'
      tag_name:
        description: Intended GitHub prerelease tag
        required: true
        type: string
        default: v1.0.1-beta.1
      acknowledge_signed_candidate_only:
        description: Build and sign candidate only; do not publish
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luhmos-signed-beta-candidate
  cancel-in-progress: false

env:
  PACKAGE_ID: art.eggiebagelface.luhmos
  KEY_ALIAS: luhmos-release
  CANONICAL_FORGE: project/hydra/samsung/android/forge
  FORGE_PROVENANCE: project/hydra/samsung/android/forge.provenance.json
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  GODOT_GRADLE_VERSION: 8.11.1
  GODOT_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

jobs:
  signed-candidate:
    name: Signed beta candidate, no publish authority
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Enforce manual Crown boundary
        shell: bash
        env:
          ACK: ${{ inputs.acknowledge_signed_candidate_only }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/luhmos-main'
          test "$ACK" = 'true'
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$TAG_NAME" = "v$VERSION_NAME"
          echo 'LUHMOS_SIGNED_CANDIDATE_AUTHORITY=BUILD_AND_SIGN_ONLY'
          echo 'LUHMOS_PUBLIC_PUBLISH=OFF'

      - name: Checkout exact beta source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact beta source and canonical forge boundary
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/luhmos/beta:refs/remotes/origin/luhmos/beta
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/luhmos/beta)" = "$RELEASE_SHA"
          python -m json.tool project/hydra/samsung/android/apk/app.reference.json >/dev/null
          python -m json.tool "$FORGE_PROVENANCE" >/dev/null
          grep -q '"package_id": "art.eggiebagelface.luhmos"' project/hydra/samsung/android/apk/app.reference.json
          grep -q '"release_signing_alias": "luhmos-release"' project/hydra/samsung/android/apk/app.reference.json
          grep -q '"release_checkout_dependency": false' "$FORGE_PROVENANCE"
          grep -q '"vue_runtime_included": false' "$FORGE_PROVENANCE"
          test -f "$CANONICAL_FORGE/project.godot"
          test -f "$CANONICAL_FORGE/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt"
          if git ls-files | grep -E '(^|/)(\.secrets|private)/|\.(jks|keystore|p12|pfx|pkcs12|key|pem)$'; then
            echo 'Tracked signing/private material detected.' >&2
            exit 1
          fi
          ! grep -R -nE 'http://127\.0\.0\.1|http://localhost|com\.termux\.RUN_COMMAND|RunCommandService|KAI 9000|PROJECT HYDRA|\.vue(["'"'"' ]|$)' "$CANONICAL_FORGE"
          grep -q 'cleartextTrafficPermitted="false"' "$CANONICAL_FORGE/android-plugin/plugin/src/main/res/xml/cathedral_network_security.xml"
          ! grep -q 'cleartextTrafficPermitted="true"' "$CANONICAL_FORGE/android-plugin/plugin/src/main/res/xml/cathedral_network_security.xml"
          GAME=project/hydra/samsung/android/cathedral-game
          python "$GAME/tools/validate-source.py" "$GAME"
          grep -q 'LUHM_PUBLIC_BETA_IDENTITY_OVERLAY_V1' "$GAME/crown-cathedral.js"
          grep -q 'LUHM OS CATHEDRAL V1' "$GAME/crown-cathedral.js"
          grep -q 'LUHM OS // SOURCE-OF-TRUTH DEMO' "$GAME/crown-cathedral.js"
          grep -q 'PUBLIC BETA CANDIDATE · ORIGINAL LUHM OS SYSTEMS' "$GAME/crown-cathedral.js"
          echo 'LUHMOS_BETA_SOURCE_AND_FORGE_GREEN'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot toolchain
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/luhmos/godot-4.7.2"
          WORK="$RUNNER_TEMP/luhmos-godot"
          mkdir -p "$CACHE" "$WORK"
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/export_templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/export_templates.tpz" | sha256sum --check --strict
          GRADLE_ZIP="$CACHE/gradle-${GODOT_GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 5 --retry-all-errors -o "$GRADLE_ZIP" "https://services.gradle.org/distributions/gradle-${GODOT_GRADLE_VERSION}-bin.zip"
          echo "${GODOT_GRADLE_SHA256}  $GRADLE_ZIP" | sha256sum --check --strict
          unzip -q -o "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          unzip -q "$CACHE/export_templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          PATCH_DIR="$WORK/android-source-patched"
          mkdir -p "$PATCH_DIR"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH_DIR"
          WRAPPER_PROPS="$(find "$PATCH_DIR" -type f -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          test -n "$WRAPPER_PROPS"
          python - "$WRAPPER_PROPS" "$GRADLE_ZIP" "$GODOT_GRADLE_SHA256" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); uri=Path(sys.argv[2]).resolve().as_uri(); digest=sys.argv[3]
          lines=path.read_text(encoding='utf-8').splitlines(); out=[]; saw=False
          for line in lines:
              if line.startswith('distributionUrl='):
                  out.append('distributionUrl='+uri); saw=True
              elif line.startswith('distributionSha256Sum='):
                  out.append('distributionSha256Sum='+digest)
              else:
                  out.append(line)
          if not saw: raise SystemExit('missing Gradle distributionUrl')
          if not any(x.startswith('distributionSha256Sum=') for x in out): out.append('distributionSha256Sum='+digest)
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          (cd "$PATCH_DIR" && zip -q -r "$TEMPLATE_DIR/android_source.zip.new" .)
          mv "$TEMPLATE_DIR/android_source.zip.new" "$TEMPLATE_DIR/android_source.zip"

      - name: Stage canonical forge, bundle current LuHm source, and build Android plugin
        shell: bash
        run: |
          set -euo pipefail
          FORGE="$RUNNER_TEMP/luhmos-android-forge"
          rm -rf "$FORGE"
          cp -a "$CANONICAL_FORGE" "$FORGE"
          GAME="$GITHUB_WORKSPACE/project/hydra/samsung/android/cathedral-game"
          rm -rf "$FORGE/android-plugin/plugin/src/main/assets/cms"
          mkdir -p "$FORGE/android-plugin/plugin/src/main/assets/cms"
          cp -a "$GAME"/. "$FORGE/android-plugin/plugin/src/main/assets/cms/"
          gradle -p "$FORGE/android-plugin" :plugin:assemble
          test -f "$FORGE/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar"
          rm -rf "$FORGE/addons/CathedralAndroid"
          mkdir -p "$FORGE/addons/CathedralAndroid/bin/debug" "$FORGE/addons/CathedralAndroid/bin/release"
          cp -a "$FORGE/android-plugin/plugin/export_scripts_template/." "$FORGE/addons/CathedralAndroid/"
          cp "$FORGE/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar" "$FORGE/addons/CathedralAndroid/bin/debug/"
          cp "$FORGE/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar" "$FORGE/addons/CathedralAndroid/bin/release/"
          echo "LUHMOS_FORGE=$FORGE" >> "$GITHUB_ENV"
          echo 'LUHMOS_CANONICAL_FORGE_BUILD_GREEN'

      - name: Patch staged export metadata for beta identity
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          PRESET="$LUHMOS_FORGE/export_presets.cfg"
          python - "$PRESET" "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); name=sys.argv[2]; code=sys.argv[3]
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'^version/code=.*$',f'version/code={code}',text,flags=re.M)
          text=re.sub(r'^version/name=.*$',f'version/name="{name}"',text,flags=re.M)
          text=re.sub(r'^export_path=.*$',f'export_path="../build/android/luhmos-{name}.apk"',text,flags=re.M)
          p.write_text(text,encoding='utf-8')
          PY
          grep -q "version/code=$VERSION_CODE" "$PRESET"
          grep -q "version/name=\"$VERSION_NAME\"" "$PRESET"

      - name: Sign, export, verify, and bind enterprise evidence
        shell: bash
        env:
          ANDROID_KS_B64: ${{ secrets.LUHMOS_ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_PASS: ${{ secrets.LUHMOS_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASS: ${{ secrets.LUHMOS_ANDROID_KEY_PASSWORD }}
          EXPECTED_APK_FP: ${{ vars.LUHMOS_ANDROID_CERT_SHA256 || '598D7272D62DBEBB71972D6164822636AD1439CD35631D0CD43321D003C92142' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KS_B64" && test -n "$ANDROID_KS_PASS" && test -n "$ANDROID_KEY_PASS"
          test -n "$EXPECTED_APK_FP"
          test "$ANDROID_KS_PASS" = "$ANDROID_KEY_PASS"
          KS="$RUNNER_TEMP/luhmos-release.keystore"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ANDROID_KS_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$ANDROID_KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$KS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KS_PASS"
          mkdir -p "$HOME/.config/godot" build/release
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          APK="$GITHUB_WORKSPACE/build/release/luhmos-$VERSION_NAME.apk"
          "$GODOT_BIN" --headless --editor --path "$LUHMOS_FORGE" --quit
          "$GODOT_BIN" --headless --path "$LUHMOS_FORGE" --install-android-build-template --export-release 'Android Release' "$APK"
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee build/release/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tee build/release/zipalign.txt
          "$BT/aapt" dump badging "$APK" | tee build/release/badging.txt
          "$BT/aapt" dump permissions "$APK" | tee build/release/permissions.txt
          sha256sum "$APK" | tee build/release/sha256.txt
          grep -q "package: name='$PACKAGE_ID'" build/release/badging.txt
          grep -q "versionCode='$VERSION_CODE'" build/release/badging.txt
          grep -q "versionName='$VERSION_NAME'" build/release/badging.txt
          grep -q "application-label:'LuHm OS'" build/release/badging.txt
          grep -q "targetSdkVersion:'36'" build/release/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/release/badging.txt
          ! grep -q 'application-debuggable' build/release/badging.txt
          ! grep -q 'com.termux' build/release/permissions.txt
          grep -Eq 'Verified using v(2|3|4) scheme .*: true' build/release/signature.txt
          APK_FP="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/release/signature.txt | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          WANT_FP="$(printf '%s' "$EXPECTED_APK_FP" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$APK_FP" && test "$APK_FP" = "$WANT_FP"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          FORGE_PROV_SHA="$(sha256sum "$FORGE_PROVENANCE" | awk '{print $1}')"
          printf '%s\n' "$APK_FP" > build/release/android-signer-sha256.txt

          RELEASE_SHA="$RELEASE_SHA" SOURCE_TREE="$SOURCE_TREE" VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" TAG_NAME="$TAG_NAME" APK_SHA="$APK_SHA" APK_FP="$APK_FP" FORGE_PROV_SHA="$FORGE_PROV_SHA" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('build/release')
          version = os.environ['VERSION_NAME']
          apk_sha = os.environ['APK_SHA']
          source_sha = os.environ['RELEASE_SHA']
          created = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          sbom = {
              'spdxVersion': 'SPDX-2.3',
              'dataLicense': 'CC0-1.0',
              'SPDXID': 'SPDXRef-DOCUMENT',
              'name': f'LuHm OS {version} Android beta',
              'documentNamespace': f'https://eggiebagelface.art/luhmos/spdx/{apk_sha}',
              'creationInfo': {'created': created, 'creators': ['Tool: LuHm OS Signed Beta Candidate']},
              'packages': [
                  {'name':'LuHm OS Android APK','SPDXID':'SPDXRef-Package-LuHmOS','versionInfo':version,'downloadLocation':'NOASSERTION','filesAnalyzed':False,'checksums':[{'algorithm':'SHA256','checksumValue':apk_sha}]},
                  {'name':'Godot Engine','SPDXID':'SPDXRef-Package-Godot','versionInfo':'4.7.2-stable','downloadLocation':'https://github.com/godotengine/godot','filesAnalyzed':False},
                  {'name':'AndroidX WebKit','SPDXID':'SPDXRef-Package-AndroidXWebKit','versionInfo':'1.17.0','downloadLocation':'NOASSERTION','filesAnalyzed':False},
                  {'name':'Android Gradle Plugin','SPDXID':'SPDXRef-Package-AGP','versionInfo':'8.13.2','downloadLocation':'NOASSERTION','filesAnalyzed':False},
                  {'name':'Kotlin Android Plugin','SPDXID':'SPDXRef-Package-Kotlin','versionInfo':'2.2.21','downloadLocation':'NOASSERTION','filesAnalyzed':False},
              ],
              'relationships': [
                  {'spdxElementId':'SPDXRef-DOCUMENT','relationshipType':'DESCRIBES','relatedSpdxElement':'SPDXRef-Package-LuHmOS'},
                  {'spdxElementId':'SPDXRef-Package-LuHmOS','relationshipType':'DEPENDS_ON','relatedSpdxElement':'SPDXRef-Package-Godot'},
                  {'spdxElementId':'SPDXRef-Package-LuHmOS','relationshipType':'DEPENDS_ON','relatedSpdxElement':'SPDXRef-Package-AndroidXWebKit'},
              ],
          }
          (out/'sbom.spdx.json').write_text(json.dumps(sbom, indent=2)+'\n', encoding='utf-8')
          provenance = {
              'schema':'luhm-os.release-provenance.v1',
              'product':'LuHm OS',
              'package':'art.eggiebagelface.luhmos',
              'source_repository':'eggie-admin/hydra-shell-android',
              'source_branch':'luhmos/beta',
              'source_sha':source_sha,
              'source_tree':os.environ['SOURCE_TREE'],
              'version_name':version,
              'version_code':int(os.environ['VERSION_CODE']),
              'tag':os.environ['TAG_NAME'],
              'artifact':{'name':f'luhmos-{version}.apk','sha256':apk_sha,'signer_sha256':os.environ['APK_FP']},
              'canonical_forge':{'path':'project/hydra/samsung/android/forge','provenance_path':'project/hydra/samsung/android/forge.provenance.json','provenance_sha256':os.environ['FORGE_PROV_SHA'],'external_checkout':False},
              'toolchain':{'godot':'4.7.2-stable','godot_editor_sha256':os.environ['GODOT_EDITOR_SHA256'],'godot_templates_sha256':os.environ['GODOT_TEMPLATES_SHA256'],'godot_gradle':'8.11.1','godot_gradle_sha256':os.environ['GODOT_GRADLE_SHA256'],'android_build_tools':'36.1.0','target_sdk':36,'abi':'arm64-v8a','java':17},
              'workflow':{'name':'LuHm OS Signed Beta Candidate','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT'])},
              'created_utc':created,
              'public_publish_authority':False,
          }
          (out/'provenance.json').write_text(json.dumps(provenance, indent=2)+'\n', encoding='utf-8')
          PY

          SBOM_SHA="$(sha256sum build/release/sbom.spdx.json | awk '{print $1}')"
          PROV_SHA="$(sha256sum build/release/provenance.json | awk '{print $1}')"
          RELEASE_SHA="$RELEASE_SHA" TAG_NAME="$TAG_NAME" VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" APK_SHA="$APK_SHA" APK_FP="$APK_FP" SBOM_SHA="$SBOM_SHA" PROV_SHA="$PROV_SHA" python - <<'PY'
          import json, os
          out={
            'schema':'luhm-os.signed-beta-artifact.v2',
            'source_sha':os.environ['RELEASE_SHA'],
            'tag':os.environ['TAG_NAME'],
            'version_name':os.environ['VERSION_NAME'],
            'version_code':int(os.environ['VERSION_CODE']),
            'package':'art.eggiebagelface.luhmos',
            'apk_name':f"luhmos-{os.environ['VERSION_NAME']}.apk",
            'apk_sha256':os.environ['APK_SHA'],
            'signer_sha256':os.environ['APK_FP'],
            'sbom_name':'sbom.spdx.json',
            'sbom_sha256':os.environ['SBOM_SHA'],
            'provenance_name':'provenance.json',
            'provenance_sha256':os.environ['PROV_SHA'],
            'public_publish_authority':False
          }
          open('build/release/release-manifest.json','w',encoding='utf-8').write(json.dumps(out,indent=2)+'\n')
          PY
          (cd build/release && sha256sum "luhmos-$VERSION_NAME.apk" release-manifest.json sbom.spdx.json provenance.json signature.txt zipalign.txt badging.txt permissions.txt android-signer-sha256.txt > evidence-sha256.txt)
          python -m json.tool build/release/sbom.spdx.json >/dev/null
          python -m json.tool build/release/provenance.json >/dev/null
          python -m json.tool build/release/release-manifest.json >/dev/null
          echo 'LUHMOS_SIGNED_BETA_CANDIDATE_GREEN'
          echo 'LUHMOS_SBOM_PROVENANCE_BOUND_GREEN'

      - name: Upload immutable signed candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-signed-beta-${{ inputs.version_code }}-${{ github.run_number }}
          path: |
            build/release/luhmos-${{ inputs.version_name }}.apk
            build/release/release-manifest.json
            build/release/sbom.spdx.json
            build/release/provenance.json
            build/release/evidence-sha256.txt
            build/release/sha256.txt
            build/release/signature.txt
            build/release/zipalign.txt
            build/release/badging.txt
            build/release/permissions.txt
            build/release/android-signer-sha256.txt
          if-no-files-found: error
          retention-days: 30
