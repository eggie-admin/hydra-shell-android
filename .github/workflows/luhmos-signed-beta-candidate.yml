name: LuHm OS Signed Beta Candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        required: true
        type: string
      version_name:
        required: true
        type: string
      version_code:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      acknowledge_signed_candidate_only:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dispatch-registration-only:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Default-branch dispatch registration only. Canonical workflow executes from requested ref.'
