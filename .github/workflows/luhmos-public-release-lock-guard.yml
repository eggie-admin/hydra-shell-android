name: LuHm Public Release Lock Guard

on:
  workflow_dispatch:
  pull_request:
    branches:
      - luhmos-main
    paths:
      - '.github/workflows/luhmos-main-release-launch.yml'
      - '.github/workflows/luhmos-fdroid-public-release.yml'
      - '.github/workflows/luhmos-github-release.yml'
      - '.github/workflows/luhmos-izzy-github-release.yml'
      - '.github/workflows/luhmos-public-release-lock-guard.yml'
      - 'tools/public_release_lock_guard.py'
      - 'project/hydra/doctrine/proposed-source-of-truth/KAI9000_PROPOSED_PUBLIC_RELEASE_LOCK_20260917.json'
  push:
    branches:
      - luhmos-main
    paths:
      - '.github/workflows/luhmos-main-release-launch.yml'
      - '.github/workflows/luhmos-fdroid-public-release.yml'
      - '.github/workflows/luhmos-github-release.yml'
      - '.github/workflows/luhmos-izzy-github-release.yml'
      - '.github/workflows/luhmos-public-release-lock-guard.yml'
      - 'tools/public_release_lock_guard.py'
      - 'project/hydra/doctrine/proposed-source-of-truth/KAI9000_PROPOSED_PUBLIC_RELEASE_LOCK_20260917.json'

permissions:
  contents: read

jobs:
  public-release-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Compile deterministic guard
        run: python3 -m py_compile tools/public_release_lock_guard.py

      - name: Assert public release remains manual and read-only
        run: python3 tools/public_release_lock_guard.py
