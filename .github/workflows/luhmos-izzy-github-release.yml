name: LuHm OS IzzyOnDroid GitHub Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful LuHm OS Public F-Droid Release workflow run ID
        required: true
        type: string
      tag:
        description: Immutable upstream release tag
        required: true
        type: string
        default: v1.0.0
      version_name:
        description: Expected Android versionName
        required: true
        type: string
        default: 1.0.0
      version_code:
        description: Expected Android versionCode
        required: true
        type: string
        default: '100'

permissions:
  actions: read
  contents: write

concurrency:
  group: luhmos-izzy-github-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PACKAGE_ID: art.eggiebagelface.luhmos
  APK_BASENAME: luhmos-1.0.0.apk

jobs:
  publish-upstream-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.1.0' 'platforms;android-36'

      - name: Validate source workflow run and download signed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/imported
          RUN_NAME="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')"
          RUN_STATE="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status + ":" + (.conclusion // "")')"
          SOURCE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')"
          test "$RUN_NAME" = 'LuHm OS Public F-Droid Release'
          test "$RUN_STATE" = 'completed:success'
          test -n "$SOURCE_SHA"
          echo "SOURCE_RELEASE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'luhmos-fdroid-signed-*' --dir build/imported
          APK="$(find build/imported -type f -name 'luhmos-1.0.0.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Re-verify exact APK for IzzyOnDroid publication
        shell: bash
        env:
          EXPECTED_CERT_FP: ${{ vars.LUHMOS_ANDROID_CERT_SHA256 }}
          EXPECTED_VERSION_NAME: ${{ inputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERT_FP" || {
            echo 'Repository variable LUHMOS_ANDROID_CERT_SHA256 must be pinned before an upstream release.' >&2
            exit 1
          }
          BT="$ANDROID_HOME/build-tools/36.1.0"
          mkdir -p build/izzy-proof
          "$BT/apksigner" verify --verbose --print-certs "$APK_PATH" | tee build/izzy-proof/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK_PATH" | tee build/izzy-proof/zipalign.txt
          "$BT/aapt" dump badging "$APK_PATH" | tee build/izzy-proof/badging.txt
          "$BT/aapt" dump permissions "$APK_PATH" | tee build/izzy-proof/permissions.txt
          sha256sum "$APK_PATH" | tee build/izzy-proof/sha256.txt

          grep -q "package: name='${PACKAGE_ID}'" build/izzy-proof/badging.txt
          grep -q "versionName='${EXPECTED_VERSION_NAME}'" build/izzy-proof/badging.txt
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" build/izzy-proof/badging.txt
          grep -q "targetSdkVersion:'36'" build/izzy-proof/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/izzy-proof/badging.txt
          ! grep -q 'application-debuggable' build/izzy-proof/badging.txt
          ! grep -q 'testOnly' build/izzy-proof/badging.txt
          ! grep -q 'com.termux' build/izzy-proof/permissions.txt
          grep -Eq 'Verified using v(2|3|4) scheme .*: true' build/izzy-proof/signature.txt

          ACTUAL_FP="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/izzy-proof/signature.txt | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FP="$(printf '%s' "$EXPECTED_CERT_FP" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_FP" = "$EXPECTED_FP"
          printf '%s\n' "$ACTUAL_FP" > build/izzy-proof/apk-signer-sha256.txt
          echo 'IZZY_APK_RELEASE_CONTRACT_GREEN'

      - name: Refuse mutable or duplicate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable tag: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing GitHub release: $TAG" >&2
            exit 1
          fi

      - name: Publish immutable developer-signed GitHub release for IzzyOnDroid
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          cat > build/izzy-proof/release-notes.md <<EOF
          # LuHm OS ${VERSION_NAME}

          Canonical package: `${PACKAGE_ID}`  
          Android versionCode: `${VERSION_CODE}`  
          Target: Samsung Android / SDK 36 / arm64-v8a

          This is the canonical developer-signed upstream APK intended for
          IzzyOnDroid review and LuHm OS public distribution.

          The stock package does not require root, Termux, Acode/AcodeX, VNC,
          Secure Folder, Shizuku, or a separately launched localhost daemon.

          APK signing certificate SHA-256 is attached in
          `apk-signer-sha256.txt`; APK SHA-256 is attached in `sha256.txt`.
          EOF

          gh release create "$TAG" \
            "$APK_PATH#LuHm OS ${VERSION_NAME} APK" \
            'build/izzy-proof/sha256.txt#APK SHA-256' \
            'build/izzy-proof/apk-signer-sha256.txt#APK signing certificate SHA-256' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_RELEASE_SHA" \
            --title "LuHm OS ${VERSION_NAME}" \
            --notes-file build/izzy-proof/release-notes.md \
            --latest

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,assets
          echo 'IZZY_GITHUB_RELEASE_ASSET_PUBLISHED'

      - name: Upload Izzy publication proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-izzy-publication-proof-${{ inputs.tag }}
          path: build/izzy-proof/**
          if-no-files-found: error
          retention-days: 90
