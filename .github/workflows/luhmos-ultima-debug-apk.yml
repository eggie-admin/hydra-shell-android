name: LuHm OS ULTIMA Debug Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - luhmos-main
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'ultima/**'
      - 'integrations/**'
      - 'project/hydra/**'
      - 'docs/**'
      - 'fdroid/**'
      - '.github/workflows/luhmos-ultima-debug-apk.yml'
      - '.github/workflows/luhmos-fdroid-public-release.yml'

permissions:
  contents: read

concurrency:
  group: luhmos-ultima-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: 96c23c87713800fc17c80b6a972ee2e93f1bb4b1
  PACKAGE_ID: art.eggiebagelface.luhmos

jobs:
  doctrine-and-donor:
    name: LuHm doctrine + hardened Android donor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Checkout hardened Samsung donor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/luhmos-android
          persist-credentials: false

      - name: Compile and test LuHm policy plane
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m compileall -q backend tools
          python -m pytest -q backend/tests
          bash tests/hydra-sanity-audit-test.sh

      - name: Validate source-of-truth and no secret material
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool project/hydra/project.manifest.json >/dev/null
          python -m json.tool project/hydra/LUHMOS_REPO_CONVERGENCE_20260910.json >/dev/null
          python -m json.tool project/hydra/samsung/android/apk/app.reference.json >/dev/null
          python -m json.tool fdroid/final-goal.manifest.json >/dev/null
          grep -q 'art.eggiebagelface.luhmos' project/hydra/project.manifest.json
          grep -q '96c23c87713800fc17c80b6a972ee2e93f1bb4b1' project/hydra/samsung/android/apk/app.reference.json
          if git ls-files | grep -E '(^|/)(\.secrets|private)/|\.(jks|keystore|p12|pfx|pkcs12|key|pem)$|(^|/)(google-services|service-account|credentials[^/]*)\.json$'; then
            echo 'Tracked secret/signing material detected' >&2
            exit 1
          fi
          if git grep -nE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- \
            ':!*.md' ':!*.example' ':!*.template' ':!backend/tests/test_remote_ai_router.py'; then
            echo 'Secret-like credential material detected' >&2
            exit 1
          fi

      - name: Validate standalone Samsung donor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('_forge/luhmos-android/release/version.json').read_text(encoding='utf-8'))
          assert data['packageId'] == 'art.eggiebagelface.luhmos'
          assert data['version'] == '1.0.0'
          assert data['versionCode'] == 100
          PY
          PRESET='_forge/luhmos-android/godot/export_presets.cfg'
          PLUGIN='_forge/luhmos-android/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt'
          grep -q 'package/unique_name="art.eggiebagelface.luhmos"' "$PRESET"
          grep -q 'gradle_build/target_sdk="36"' "$PRESET"
          grep -q 'architectures/arm64-v8a=true' "$PRESET"
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' "$PLUGIN"
          grep -q 'setAcceptCookie(false)' "$PLUGIN"
          ! grep -R -nE 'com\.termux\.permission\.RUN_COMMAND|com\.termux\.RUN_COMMAND|RunCommandService' _forge/luhmos-android/godot/android-plugin
          ! grep -R -n 'http://127.0.0.1' _forge/luhmos-android/godot/android-plugin/plugin/src/main/java
          echo 'LUHMOS_ULTIMA_CONTRACT_GREEN'

      - name: Assert production forge is separate and manual
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/luhmos-fdroid-public-release.yml
          grep -q 'workflow_dispatch:' .github/workflows/luhmos-fdroid-public-release.yml
          grep -q -- '--export-release' .github/workflows/luhmos-fdroid-public-release.yml
          grep -q 'publish_public_mirror' .github/workflows/luhmos-fdroid-public-release.yml
          echo 'DEBUG_CI_CANNOT_PUBLISH_RELEASE'
