name: LuHm Native Install Dry Run

on:
  pull_request:
    branches:
      - luhmos/proposed-debug-oni-20260923
    paths:
      - 'project/hydra/samsung/android/**'
      - 'project/hydra/source-of-truth/LUHM_OS_NATIVE_BRIDGE_RELEASE_BOUNDARY_PROPOSAL_20260923.json'
      - 'tools/stage_android_cms_payload.py'
      - '.github/workflows/luhm-native-install-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-boundary-dry-run:
    name: Kuroko native release-boundary dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proposal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'

      - name: Sanity-check frozen floor and native bridge
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN='project/hydra/source-of-truth/LUHM_OS_GOLDEN_BETA_NO_BACKTRACK_CROWN_20260922.json'
          FORGE='project/hydra/samsung/android/forge'
          grep -q '"version_name": "1.0.10-beta.1"' "$GOLDEN"
          grep -q '"version_code": 110' "$GOLDEN"
          grep -q 'a2243d68fa1aaa2f554ef74d9a1edd32530c12ac' "$GOLDEN"
          grep -q 'LUHM_NATIVE_3D_HARNESS_V1' "$FORGE/scripts/cage_manager.gd"
          grep -q 'LUHM_MULTI_TIER_BRIDGE_V1' "$FORGE/scripts/web_cms_bridge.gd"
          grep -q 'https://appassets.androidplatform.net' "$FORGE/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt"
          ! grep -R -nE 'http://127\.0\.0\.1|http://localhost|com\.termux\.RUN_COMMAND|RunCommandService' "$FORGE"

      - name: Stage release-safe Cathedral payload
        shell: bash
        run: |
          set -euo pipefail
          GAME='project/hydra/samsung/android/cathedral-game'
          STAGE="$RUNNER_TEMP/luhm-cms"
          RECEIPT='build/dry-run/native-payload-receipt.json'
          python tools/stage_android_cms_payload.py "$GAME" "$STAGE" --receipt "$RECEIPT"
          test -f "$STAGE/index.html"
          test ! -e "$STAGE/python"
          test ! -e "$STAGE/tools"
          python -m json.tool "$RECEIPT" >/dev/null
          grep -q '"development_loopback_harness_included": false' "$RECEIPT"
          grep -q '"forbidden_hits": \[\]' "$RECEIPT"

      - name: Compile Android Godot plugin without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN='project/hydra/samsung/android/forge/android-plugin'
          gradle -p "$PLUGIN" :plugin:assemble
          test -s "$PLUGIN/plugin/build/outputs/aar/CathedralAndroid-debug.aar"
          test -s "$PLUGIN/plugin/build/outputs/aar/CathedralAndroid-release.aar"
          mkdir -p build/dry-run
          cp "$PLUGIN/plugin/build/outputs/aar/CathedralAndroid-debug.aar" build/dry-run/
          cp "$PLUGIN/plugin/build/outputs/aar/CathedralAndroid-release.aar" build/dry-run/
          sha256sum build/dry-run/*.aar > build/dry-run/aar-sha256.txt

      - name: Prove dry-run has no release authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${LUHMOS_ANDROID_KEYSTORE_B64:-}"
          test -z "${LUHMOS_ANDROID_KEYSTORE_PASSWORD:-}"
          test -z "${LUHMOS_ANDROID_KEY_PASSWORD:-}"
          echo 'LUHM_DRY_RUN_SIGNING=OFF'
          echo 'LUHM_DRY_RUN_PUBLISH=OFF'
          echo 'LUHM_DRY_RUN_INSTALL=OFF'

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: luhm-native-install-dry-run
          path: build/dry-run/
          if-no-files-found: error
          retention-days: 7
