name: KAI9000 Secure APK

on:
  workflow_dispatch:
  push:
    branches:
      - witching-hour-secure-apk
    paths:
      - "secure-apk/**"
      - ".github/workflows/kai9000-secure-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build one APK
        working-directory: secure-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="secure-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" KAI9000-SecureFolder-debug.apk
          sha256sum KAI9000-SecureFolder-debug.apk | tee KAI9000-SecureFolder-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAI9000-SecureFolder-debug
          path: |
            KAI9000-SecureFolder-debug.apk
            KAI9000-SecureFolder-debug.apk.sha256
          if-no-files-found: error
