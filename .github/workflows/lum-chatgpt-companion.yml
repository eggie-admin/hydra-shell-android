name: LuHm ChatGPT Companion

on:
  push:
    branches:
      - feature/lum-chatgpt-companion-extension
    paths:
      - 'tools/lum-chatgpt-companion/**'
      - '.github/instructions/lum-chatgpt-companion.instructions.md'
      - '.github/workflows/lum-chatgpt-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: python -m json.tool tools/lum-chatgpt-companion/manifest.json >/dev/null

      - name: Guard against auto-send
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'click\(\)|dispatchEvent\(.*(Enter|submit)|requestSubmit\(' tools/lum-chatgpt-companion/*.js; then
            echo 'Potential auto-submit behavior detected.' >&2
            exit 1
          fi

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          cd tools/lum-chatgpt-companion
          zip -r "$GITHUB_WORKSPACE/luhm-chatgpt-companion.zip" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: luhm-chatgpt-companion
          path: luhm-chatgpt-companion.zip
