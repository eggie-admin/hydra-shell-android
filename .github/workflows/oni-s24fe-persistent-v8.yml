name: KAI 9000 S24 FE Persistent Portrait v8

on:
  workflow_dispatch:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/oni-s24fe-persistent-v8.yml'

permissions:
  contents: read

concurrency:
  group: kai9000-s24fe-v8-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: fix/s24fe-persistent-portrait-v8
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  ANDROID_GRADLE_VERSION: 8.11.1
  ANDROID_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
  APK_NAME: kai9000-s24fe-v8-debug.apk
  PACKAGE_ID: art.eggiebagelface.videoforge.dev
  VERSION_CODE: '8'
  VERSION_NAME: 0.6.2-dev

jobs:
  forge-v8:
    name: Forge S24 FE portrait v8
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout KAI altar
        uses: actions/checkout@v4

      - name: Checkout patched Android donor
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/vue-headless-cms

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify v8 Android contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('_forge/vue-headless-cms')
          v = json.loads((root / 'release/version.json').read_text())
          assert v['packageId'] == 'art.eggiebagelface.videoforge.dev'
          assert v['versionCode'] == 8
          assert v['version'] == '0.6.2-dev'
          p = (root / 'godot/export_presets.cfg').read_text()
          g = (root / 'godot/project.godot').read_text()
          checks = [
              'version/code=8',
              'version/name="0.6.2-dev"',
              'package/unique_name="art.eggiebagelface.videoforge.dev"',
              'package/show_in_app_library=true',
              'package/show_as_launcher_app=true',
              'screen/immersive_mode=false',
          ]
          for c in checks: assert c in p, c
          for c in ['size/viewport_width=1080','size/viewport_height=1920','handheld/orientation=1','stretch/mode="canvas_items"','stretch/aspect="expand"']:
              assert c in g, c
          print('S24FE_V8_SOURCE_CONTRACT_GREEN')
          PY

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot and pin Android Gradle
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/kai9000/s24fe-v8"
          WORK="$RUNNER_TEMP/kai-godot-v8"
          mkdir -p "$CACHE" "$WORK"
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/templates.tpz" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          echo "${ANDROID_GRADLE_SHA256}  $CACHE/gradle.zip" | sha256sum --check --strict
          unzip -q "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          unzip -q "$CACHE/templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          PATCH="$WORK/android-source"
          mkdir -p "$PATCH"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH"
          PROPS="$(find "$PATCH" -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          python - "$PROPS" "$CACHE/gradle.zip" "$ANDROID_GRADLE_SHA256" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          uri = pathlib.Path(sys.argv[2]).resolve().as_uri()
          sha = sys.argv[3]
          out=[]; saw_sha=False
          for line in p.read_text().splitlines():
              if line.startswith('distributionUrl='):
                  out.append('distributionUrl=' + uri)
              elif line.startswith('distributionSha256Sum='):
                  out.append('distributionSha256Sum=' + sha); saw_sha=True
              else:
                  out.append(line)
          if not saw_sha: out.append('distributionSha256Sum=' + sha)
          p.write_text('\n'.join(out)+'\n')
          PY
          (cd "$PATCH" && zip -q -r "$TEMPLATE_DIR/android_source.zip.new" .)
          mv "$TEMPLATE_DIR/android_source.zip.new" "$TEMPLATE_DIR/android_source.zip"

      - name: Build Vue cockpit and Android plugin
        shell: bash
        run: |
          set -euo pipefail
          cd _forge/vue-headless-cms/apps
          npm install --global npm@12.0.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace=video-forge-ui
          cd ..
          rm -rf godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p godot/android-plugin/plugin/src/main/assets/cms
          cp -a apps/forge-ui/dist/. godot/android-plugin/plugin/src/main/assets/cms/
          gradle -p godot/android-plugin :plugin:assemble
          rm -rf godot/addons/CathedralAndroid
          mkdir -p godot/addons/CathedralAndroid/bin/debug godot/addons/CathedralAndroid/bin/release
          cp -a godot/android-plugin/plugin/export_scripts_template/. godot/addons/CathedralAndroid/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar godot/addons/CathedralAndroid/bin/debug/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar godot/addons/CathedralAndroid/bin/release/

      - name: Configure build inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > _forge/vue-headless-cms/godot/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#090d12"/><circle cx="256" cy="256" r="168" fill="none" stroke="#63f5d2" stroke-width="28"/><path d="M160 330V182h44v61l63-61h59l-75 70 83 78h-62l-68-66v66z" fill="#f5fbff"/></svg>
          SVG
          python - <<'PY'
          from pathlib import Path
          p=Path('_forge/vue-headless-cms/godot/project.godot')
          t=p.read_text()
          if 'config/icon=' not in t:
              t=t.replace('config/name="KAI 9000"\n','config/name="KAI 9000"\nconfig/icon="res://icon.svg"\n',1)
              p.write_text(t)
          PY
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          KEYSTORE="$RUNNER_TEMP/kai9000-v8-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=KAI 9000 S24 FE v8 Debug,O=LuHm OS,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Export and verify v8 APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path _forge/vue-headless-cms/godot --quit
          "$GODOT_BIN" --headless --path _forge/vue-headless-cms/godot --install-android-build-template \
            --export-debug 'Android Debug' "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          APK="build/android/$APK_NAME"
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/aapt" dump badging "$APK" | tee build/android/badging.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | tee build/android/manifest.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          sha256sum "$APK" > build/android/sha256.txt
          grep -q "package: name='${PACKAGE_ID}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" build/android/badging.txt
          grep -q "launchable-activity:" build/android/badging.txt
          echo 'S24FE_V8_APK_GREEN'

      - name: Create phone verification helper
        shell: bash
        run: |
          set -euo pipefail
          cat > build/android/kai9000-phone-verify.sh <<'SH'
          #!/data/data/com.termux/files/usr/bin/bash
          set -u
          PKG='art.eggiebagelface.videoforge.dev'
          echo '=== KAI 9000 PHONE PERSISTENCE CHECK ==='
          echo '[owner profile package]'
          pm list packages --user 0 2>/dev/null | grep -Fx "package:$PKG" || true
          echo '[all/including uninstalled records]'
          pm list packages -u 2>/dev/null | grep -Fx "package:$PKG" || true
          echo '[disabled packages]'
          pm list packages -d 2>/dev/null | grep -Fx "package:$PKG" || true
          echo '[launcher]'
          cmd package resolve-activity --brief "$PKG" 2>/dev/null || true
          echo '[apk path]'
          pm path "$PKG" 2>/dev/null || true
          echo '[users]'
          pm list users 2>/dev/null || true
          echo '=== END ==='
          SH
          chmod +x build/android/kai9000-phone-verify.sh

      - name: Upload S24 FE v8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai9000-s24fe-v8-${{ github.run_number }}
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/badging.txt
            build/android/manifest.txt
            build/android/signature.txt
            build/android/sha256.txt
            build/android/kai9000-phone-verify.sh
          if-no-files-found: error
          retention-days: 14
