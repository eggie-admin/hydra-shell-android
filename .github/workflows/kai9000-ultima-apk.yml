name: KAI 9000 ULTIMA APK

on:
  workflow_dispatch:
  push:
    branches: [testing/luhm-os-android]
    paths:
      - 'luhmos/samsung-android-s24/native-cathedral/**'
      - 'luhmos/samsung-android-s24/live2d-chat/**'
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'lumh-os/**'
      - 'project/hydra/samsung/android/apk/**'
      - 'docs/**'
      - 'THANKS.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/kai9000-ultima-apk.yml'
  pull_request:
    branches: [testing/luhm-os-android]
    paths:
      - 'luhmos/samsung-android-s24/native-cathedral/**'
      - 'luhmos/samsung-android-s24/live2d-chat/**'
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'lumh-os/**'
      - 'project/hydra/samsung/android/apk/**'
      - 'docs/**'
      - 'THANKS.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/kai9000-ultima-apk.yml'

permissions:
  contents: read

concurrency:
  group: kai9000-ultima-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: luhmos/samsung-android-s24/native-cathedral
  UI_SRC: luhmos/samsung-android-s24/live2d-chat
  PACKAGE_ID: art.eggiebagelface.kai9000.dev
  VERSION_NAME: 0.8.0-dev
  VERSION_CODE: '8'
  APK_NAME: kai9000-dev.apk
  DONOR_PURGED_BEFORE_APK: 'true'

jobs:
  doctrine:
    name: Donor purge + doctrine gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify KAI-owned APK source
        shell: bash
        run: |
          set -euo pipefail
          test "$DONOR_PURGED_BEFORE_APK" = 'true'
          test -f "$APP_DIR/app/build.gradle.kts"
          test -f "$APP_DIR/app/src/main/AndroidManifest.xml"
          test -f "$UI_SRC/index.html"
          test -f THANKS.md

          if git ls-files "$APP_DIR" | grep -Ei '(^|/)(donor|chrome[-_]?dev|chrome[-_]?canary|chromium[-_]?donor)(/|$)'; then
            echo 'Donor/browser harness payload found inside KAI-owned APK source' >&2
            exit 1
          fi

          if git ls-files "$APP_DIR" | grep -Ei '\.(apk|aar|jar|so)$'; then
            echo 'Vendored binary payload found inside KAI-owned APK source' >&2
            exit 1
          fi

          if grep -RniE 'repository:[[:space:]]*.*(vue-headless-cms|chrome)|DONOR_REPO|Checkout pinned KAI donor' .github/workflows/kai9000-ultima-apk.yml; then
            echo 'Legacy donor checkout detected in active APK workflow' >&2
            exit 1
          fi

          grep -q 'Chrome Dev and Chrome Canary are test/behavior harnesses only' AGENTS.md
          echo 'DONOR_PURGED_BEFORE_APK=true'
          echo 'KAI_OWNED_SOURCE_GREEN'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test Python control plane
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m compileall -q backend tools ultima/ollama-ffmpeg-antenna-v3
          python -m pytest -q backend/tests
          bash tests/hydra-sanity-audit-test.sh

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.secrets|private)/|\.(jks|keystore|p12|pfx|pkcs12|key|pem)$|(^|/)(google-services|service-account|credentials[^/]*)\.json$'; then
            echo 'Tracked secret/signing material detected' >&2
            exit 1
          fi
          if git grep -nE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- ':!*.md' ':!*.example' ':!*.template' ':!backend/tests/test_remote_ai_router.py'; then
            echo 'Secret-like credential material detected' >&2
            exit 1
          fi
          echo 'KAI_DOCTRINE_GREEN'

  apk:
    name: KAI-owned native Cathedral APK
    needs: [doctrine]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Stage KAI-owned cockpit assets
        shell: bash
        run: |
          set -euo pipefail
          DEST="$APP_DIR/app/src/main/assets/cathedral"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$UI_SRC/." "$DEST/"
          test -f "$DEST/index.html"
          test -f "$DEST/app.js"
          test -f "$DEST/style.css"
          echo 'KAI_COCKPIT_ASSETS_GREEN'

      - name: Build KAI 9000 native APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$APP_DIR" :app:assembleDebug
          SRC="$APP_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          mkdir -p build/android
          cp "$SRC" "build/android/$APK_NAME"

      - name: Verify APK identity, signature, alignment, source boundary
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee build/android/zipalign.txt
          "$TOOLS/aapt" dump badging "$APK" | tee build/android/badging.txt
          unzip -l "$APK" | tee build/android/contents.txt
          sha256sum "$APK" | tee build/android/sha256.txt

          grep -q "package: name='$PACKAGE_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" build/android/badging.txt
          grep -q 'assets/cathedral/index.html' build/android/contents.txt

          if grep -Ei '(^|/)(chrome[-_]?dev|chrome[-_]?canary|chromium[-_]?donor|donor)(/|$)' build/android/contents.txt; then
            echo 'Donor or Chrome harness payload detected in APK' >&2
            exit 1
          fi

          printf '%s\n' 'DONOR_PURGED_BEFORE_APK=true' | tee build/android/donor-purge.txt
          echo 'KAI_APK_GREEN'
          echo 'ULTIMA_GREEN'

      - name: Upload KAI 9000 APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kai9000-native-cathedral-${{ github.run_number }}
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/contents.txt
            build/android/donor-purge.txt
          if-no-files-found: error
          retention-days: 7
