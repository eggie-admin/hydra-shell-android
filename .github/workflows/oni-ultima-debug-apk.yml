name: Oni Summoning - Ultima Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - testing/luhm-os-android
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'ultima/**'
      - 'integrations/**'
      - 'lumh-os/**'
      - 'project/hydra/**'
      - 'docs/**'
      - 'release/**'
      - '.github/**'
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'ultima/**'
      - 'integrations/**'
      - 'lumh-os/**'
      - 'project/hydra/**'
      - 'docs/**'
      - 'release/**'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: oni-ultima-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: 88be3ea5d9bcdecfcaf035b043cd112002dc06d7
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  ANDROID_GRADLE_VERSION: 8.11.1
  ANDROID_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
  APK_NAME: kai9000-luhm-os-testing-debug.apk

jobs:
  doctrine-preflight:
    name: Doctrine + Python preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Compile and test local plane
        run: |
          set -euo pipefail
          python -m compileall -q backend tools ultima/ollama-ffmpeg-antenna-v3
          python -m pytest -q backend/tests
          bash tests/hydra-sanity-audit-test.sh

      - name: Ten-pass doctrine invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f lumh-os/kai9000/AI_MAGIC_DOCTRINE.md
          test -f lumh-os/kai9000/project.manifest.json
          test -f docs/API_TRINITY_DOCTRINE.md
          test -f docs/EGGIEBAGELFACE_ART_IDENTITY.md
          test -f docs/KAI9000_APK_ARCHITECTURE_HARDENING_10PASS_20260907.md
          test -f integrations/vendor-apis.manifest.json
          test -f project/hydra/samsung/android/apk/testing-ingest.manifest.json
          python -m json.tool integrations/vendor-apis.manifest.json >/dev/null
          python -m json.tool lumh-os/kai9000/project.manifest.json >/dev/null
          python -m json.tool project/hydra/samsung/android/apk/testing-ingest.manifest.json >/dev/null

          # External hosting is never Android build authority and secret values must not be embedded.
          ! grep -RniE 'vercel|OPENAI_API_KEY[[:space:]]*=|CLOUDFLARE_API_TOKEN[[:space:]]*=|GOOGLE_APPLICATION_CREDENTIALS[[:space:]]*=' \
            lumh-os project docs release integrations ultima .github 2>/dev/null

          # No tracked secret directories, private keys, signing containers, or provider credential files.
          if git ls-files | grep -E '(^|/)(\.secrets|private)/|\.(jks|keystore|p12|pfx|pkcs12|key|pem)$|(^|/)(google-services|service-account|credentials[^/]*)\.json$'; then
            echo 'Tracked secret/signing material detected' >&2
            exit 1
          fi
          if git grep -nE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- ':!*.md' ':!*.example' ':!*.template'; then
            echo 'Secret-like credential material detected' >&2
            exit 1
          fi

          # The APK workflow itself must use immutable 40-hex Action revisions.
          python - <<'PY'
          import pathlib, re
          path = pathlib.Path('.github/workflows/oni-ultima-debug-apk.yml')
          bad = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              stripped = line.strip()
              if not stripped.startswith('- uses:') and not stripped.startswith('uses:'):
                  continue
              value = stripped.split('uses:', 1)[1].strip().split('#', 1)[0].strip()
              if not re.search(r'@[0-9a-f]{40}$', value):
                  bad.append((number, value))
          if bad:
              raise SystemExit(f'mutable GitHub Action references: {bad}')
          PY

          grep -q '"schema": "kai9000.android-testing-ingest.v3"' project/hydra/samsung/android/apk/testing-ingest.manifest.json
          grep -q '88be3ea5d9bcdecfcaf035b043cd112002dc06d7' project/hydra/samsung/android/apk/testing-ingest.manifest.json
          echo 'TEN_PASS_DOCTRINE_GREEN'

  android-debug:
    name: Godot Android debug forge
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout LuHm OS altar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned Samsung APK donor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/vue-headless-cms
          persist-credentials: false

      - name: Verify hardened donor boundaries
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='_forge/vue-headless-cms/godot/android-plugin/plugin/src/main/AndroidManifest.xml'
          NET='_forge/vue-headless-cms/godot/android-plugin/plugin/src/main/res/xml/cathedral_network_security.xml'
          PLUGIN='_forge/vue-headless-cms/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt'
          WIDGET='_forge/vue-headless-cms/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralWidgetProvider.kt'
          grep -q 'android:exported="false"' "$MANIFEST"
          grep -q 'cleartextTrafficPermitted="false"' "$NET"
          grep -q '>127.0.0.1<' "$NET"
          grep -q 'allowFileAccess = false' "$PLUGIN"
          grep -q 'allowContentAccess = false' "$PLUGIN"
          grep -q 'setAcceptThirdPartyCookies(view, false)' "$PLUGIN"
          grep -q 'setOf(APP_ORIGIN)' "$PLUGIN"
          grep -q 'arrayOf(command)' "$WIDGET"
          ! grep -q 'Runtime.getRuntime().exec' "$WIDGET"
          echo 'ANDROID_BOUNDARIES_GREEN'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm24-${{ hashFiles('_forge/vue-headless-cms/apps/package.json', '_forge/vue-headless-cms/apps/forge-ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm24-

      - name: Cache verified Godot and Android Gradle archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kai9000/godot-4.7.2
          key: ${{ runner.os }}-godot-4.7.2-${{ env.GODOT_EDITOR_SHA256 }}-${{ env.GODOT_TEMPLATES_SHA256 }}-gradle-${{ env.ANDROID_GRADLE_VERSION }}-${{ env.ANDROID_GRADLE_SHA256 }}

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot 4.7.2 and pin Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/kai9000/godot-4.7.2"
          WORK="$RUNNER_TEMP/kai-godot"
          mkdir -p "$CACHE" "$WORK"

          if [ ! -s "$CACHE/godot.zip" ]; then
            curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          fi
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict

          if [ ! -s "$CACHE/export_templates.tpz" ]; then
            curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/export_templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          fi
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/export_templates.tpz" | sha256sum --check --strict

          GRADLE_ZIP="$CACHE/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          if [ ! -s "$GRADLE_ZIP" ]; then
            curl --fail --location --retry 5 --retry-all-errors -o "$GRADLE_ZIP" \
              "https://services.gradle.org/distributions/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          fi
          echo "${ANDROID_GRADLE_SHA256}  $GRADLE_ZIP" | sha256sum --check --strict

          unzip -q -o "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          rm -rf "$WORK/templates"
          mkdir -p "$WORK/templates"
          unzip -q "$CACHE/export_templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_source.zip"

          PATCH_DIR="$WORK/android-source-patched"
          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH_DIR"
          WRAPPER_PROPS="$(find "$PATCH_DIR" -type f -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          test -n "$WRAPPER_PROPS"

          WRAPPER_PROPS="$WRAPPER_PROPS" \
          ANDROID_GRADLE_ZIP="$GRADLE_ZIP" \
          ANDROID_GRADLE_SHA256="$ANDROID_GRADLE_SHA256" \
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['WRAPPER_PROPS'])
          lines = path.read_text(encoding='utf-8').splitlines()
          uri = Path(os.environ['ANDROID_GRADLE_ZIP']).resolve().as_uri()
          digest = os.environ['ANDROID_GRADLE_SHA256']
          out = []
          saw_url = False
          saw_sha = False
          for line in lines:
              if line.startswith('distributionUrl='):
                  out.append(f'distributionUrl={uri}')
                  saw_url = True
              elif line.startswith('distributionSha256Sum='):
                  out.append(f'distributionSha256Sum={digest}')
                  saw_sha = True
              else:
                  out.append(line)
          if not saw_url:
              raise SystemExit('Gradle wrapper is missing distributionUrl')
          if not saw_sha:
              out.append(f'distributionSha256Sum={digest}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          rm -f "$TEMPLATE_DIR/android_source.zip.new"
          (cd "$PATCH_DIR" && zip -q -r "$TEMPLATE_DIR/android_source.zip.new" .)
          mv "$TEMPLATE_DIR/android_source.zip.new" "$TEMPLATE_DIR/android_source.zip"
          echo 'ANDROID_GRADLE_WRAPPER_PINNED'

      - name: Build Vue cockpit and record lock provenance
        working-directory: _forge/vue-headless-cms/apps
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/build/provenance"
          sha256sum package-lock.json | tee "$GITHUB_WORKSPACE/build/provenance/npm-package-lock.sha256"
          npm run build --workspace=video-forge-ui
          test -f forge-ui/dist/index.html

      - name: Build Godot Android plugin
        working-directory: _forge/vue-headless-cms
        run: |
          set -euo pipefail
          rm -rf godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p godot/android-plugin/plugin/src/main/assets/cms
          cp -a apps/forge-ui/dist/. godot/android-plugin/plugin/src/main/assets/cms/
          gradle -p godot/android-plugin :plugin:assemble
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar

          rm -rf godot/addons/CathedralAndroid
          mkdir -p godot/addons/CathedralAndroid/bin/debug godot/addons/CathedralAndroid/bin/release
          cp -a godot/android-plugin/plugin/export_scripts_template/. godot/addons/CathedralAndroid/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar godot/addons/CathedralAndroid/bin/debug/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar godot/addons/CathedralAndroid/bin/release/

      - name: Inject deterministic KAI testing icon
        working-directory: _forge/vue-headless-cms
        shell: bash
        run: |
          set -euo pipefail
          cat > godot/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="96" fill="#090d12"/>
            <circle cx="256" cy="256" r="168" fill="none" stroke="#63f5d2" stroke-width="28"/>
            <path d="M160 330V182h44v61l63-61h59l-75 70 83 78h-62l-68-66v66z" fill="#f5fbff"/>
          </svg>
          SVG
          python - <<'PY'
          from pathlib import Path

          path = Path('godot/project.godot')
          text = path.read_text(encoding='utf-8')
          if 'config/icon=' not in text:
              anchor = 'config/name="Video Forge Cathedral"\n'
              if anchor not in text:
                  raise SystemExit('project.godot application name anchor not found')
              text = text.replace(anchor, anchor + 'config/icon="res://icon.svg"\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -q 'config/icon="res://icon.svg"' godot/project.godot
          test -s godot/icon.svg

      - name: Run Samsung architecture gates
        working-directory: _forge/vue-headless-cms
        run: |
          set -euo pipefail
          python scripts/cathedral_full_sanity.py
          python scripts/samsung_edge_sanity.py

      - name: Configure ephemeral debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          KEYSTORE="$RUNNER_TEMP/kai9000-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=KAI 9000 Debug,O=LuHm OS,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Import and export Android debug APK
        working-directory: _forge/vue-headless-cms
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path godot --quit
          "$GODOT_BIN" --headless --path godot \
            --install-android-build-template \
            --export-debug 'Android Debug' \
            "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          test -s "$GITHUB_WORKSPACE/build/android/$APK_NAME"

      - name: Verify APK identity and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee build/android/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build/android/badging.txt
          unzip -l "$APK" | tee build/android/contents.txt
          sha256sum "$APK" | tee build/android/sha256.txt
          grep -q 'lib/arm64-v8a/' build/android/contents.txt
          grep -q 'assets/cms/index.html' build/android/contents.txt

      - name: Upload testing APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kai9000-luhm-os-testing-debug-${{ github.run_number }}
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/contents.txt
            build/provenance/npm-package-lock.sha256
            _forge/vue-headless-cms/apps/package-lock.json
          if-no-files-found: error
          retention-days: 7

  fdroid-stage:
    name: Black Magic F-Droid stage
    needs: [android-debug]
    if: needs.android-debug.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Airship coordinates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned Samsung donor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/vue-headless-cms
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Download APK evidence from this ULTIMA run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kai9000-luhm-os-testing-debug-${{ github.run_number }}
          path: build/apk-evidence

      - name: Stage F-Droid binary repository input
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE/build/apk-evidence" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"

          PACKAGE_ID="$(python -c 'import json; print(json.load(open("_forge/vue-headless-cms/release/version.json"))["packageId"])')"
          VERSION_CODE="$(python -c 'import json; print(json.load(open("_forge/vue-headless-cms/release/version.json"))["versionCode"])')"
          VERSION_NAME="$(python -c 'import json; print(json.load(open("_forge/vue-headless-cms/release/version.json"))["version"])')"

          cd _forge/vue-headless-cms
          python scripts/stage_fdroid_repo.py \
            --apk "$APK" \
            --output "$GITHUB_WORKSPACE/build/fdroid-stage" \
            --package "$PACKAGE_ID" \
            --version-code "$VERSION_CODE"
          cd "$GITHUB_WORKSPACE"

          SOURCE_RUN_ID="$GITHUB_RUN_ID" \
          SOURCE_COMMIT="$GITHUB_SHA" \
          PACKAGE_ID="$PACKAGE_ID" \
          VERSION_NAME="$VERSION_NAME" \
          VERSION_CODE="$VERSION_CODE" \
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('build/fdroid-stage')
          manifest = {
              'schema': 'kai9000.fdroid-stage.v2',
              'source_workflow_run': int(os.environ['SOURCE_RUN_ID']),
              'source_commit': os.environ['SOURCE_COMMIT'],
              'package_id': os.environ['PACKAGE_ID'],
              'version': os.environ['VERSION_NAME'],
              'version_code': int(os.environ['VERSION_CODE']),
              'signed_repo': False,
              'importable_repo': False,
              'state': 'FDROID_STAGED',
              'next_gate': 'persistent APK signing identity + persistent F-Droid repo signing identity + fdroid update + HTTPS publication',
          }
          (root / 'FINAL_FORM_STATUS.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify F-Droid staging bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fdroid-stage/repo/art.eggiebagelface.videoforge.dev_6.apk
          test -s build/fdroid-stage/metadata/art.eggiebagelface.videoforge.dev.yml
          test -s build/fdroid-stage/SHA256SUMS
          test -s build/fdroid-stage/FINAL_FORM_STATUS.json
          grep -q 'This is not a signed F-Droid repository yet' build/fdroid-stage/README.txt
          grep -q '"state": "FDROID_STAGED"' build/fdroid-stage/FINAL_FORM_STATUS.json
          echo 'FDROID_STAGED'

      - name: Upload Black Magic staging bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kai9000-fdroid-stage-${{ github.run_number }}
          path: build/fdroid-stage/**
          if-no-files-found: error
          retention-days: 14

  ultima-gate:
    name: Final Ultima gate
    if: always()
    needs: [doctrine-preflight, android-debug, fdroid-stage]
    runs-on: ubuntu-24.04
    steps:
      - name: Require doctrine, APK, and F-Droid stage green
        env:
          PREFLIGHT: ${{ needs.doctrine-preflight.result }}
          APK: ${{ needs.android-debug.result }}
          FDROID: ${{ needs.fdroid-stage.result }}
        run: |
          set -euo pipefail
          printf 'Doctrine preflight: %s\nAPK forge: %s\nF-Droid stage: %s\n' "$PREFLIGHT" "$APK" "$FDROID"
          test "$PREFLIGHT" = success
          test "$APK" = success
