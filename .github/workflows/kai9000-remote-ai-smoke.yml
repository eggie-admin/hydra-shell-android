name: KAI9000 Remote AI Media Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/kai9000_remote_smoke.py"
      - ".github/workflows/kai9000-remote-ai-smoke.yml"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "docs/API_TRINITY_DOCTRINE.md"
      - "integrations/vendor-apis.manifest.json"
  push:
    branches: [main]
    paths:
      - "tools/kai9000_remote_smoke.py"
      - ".github/workflows/kai9000-remote-ai-smoke.yml"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "docs/API_TRINITY_DOCTRINE.md"
      - "integrations/vendor-apis.manifest.json"

permissions:
  contents: read

jobs:
  remote-ai-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SMOKE_MODEL: gpt-6-astra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install KAI9000 runtime
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Remote GitHub + OpenAI + Edge Gallery + MP4 pipeline smoke
        run: |
          python tools/kai9000_remote_smoke.py --report kai9000-remote-smoke-report.json

      - name: Show smoke report
        if: always()
        run: |
          test -f kai9000-remote-smoke-report.json && cat kai9000-remote-smoke-report.json || true

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai9000-remote-ai-media-smoke
          path: kai9000-remote-smoke-report.json
          if-no-files-found: ignore
