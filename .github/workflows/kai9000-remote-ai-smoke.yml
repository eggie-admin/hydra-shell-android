name: LuHm OS Remote Assistance Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/kai9000_remote_smoke.py"
      - "tools/remote_ai_smoke.py"
      - "tools/remote_assistance_guard.py"
      - "tools/remote_assistance_bench.py"
      - "tools/runtime_capability_guard.py"
      - ".github/workflows/kai9000-remote-ai-smoke.yml"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "backend/tests/test_remote_ai_router.py"
      - "backend/tests/test_remote_assistance.py"
      - "backend/tests/test_google_assist.py"
      - "docs/API_TRINITY_DOCTRINE.md"
      - "docs/LUHMOS_REMOTE_AI_10PASS_HARDENING.md"
      - "integrations/vendor-apis.manifest.json"
      - "integrations/runtime-capabilities.policy.json"
      - "integrations/openai/responses.template.json"
  push:
    branches: [luhmos-main]
    paths:
      - "tools/kai9000_remote_smoke.py"
      - "tools/remote_ai_smoke.py"
      - "tools/remote_assistance_guard.py"
      - "tools/remote_assistance_bench.py"
      - "tools/runtime_capability_guard.py"
      - ".github/workflows/kai9000-remote-ai-smoke.yml"
      - "ultima/ollama-ffmpeg-antenna-v3/**"
      - "backend/tests/test_remote_ai_router.py"
      - "backend/tests/test_remote_assistance.py"
      - "backend/tests/test_google_assist.py"
      - "docs/API_TRINITY_DOCTRINE.md"
      - "docs/LUHMOS_REMOTE_AI_10PASS_HARDENING.md"
      - "integrations/vendor-apis.manifest.json"
      - "integrations/runtime-capabilities.policy.json"
      - "integrations/openai/responses.template.json"

permissions:
  contents: read

jobs:
  api-spine-smoke:
    name: API spine fast smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_FAST_MODEL: gpt-5.6-luna
      OPENAI_MODEL: gpt-5.6-sol
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_FAST_MODEL: openai/gpt-oss-20b:fastest
      HF_MODEL: openai/gpt-oss-120b:fastest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ultima/ollama-ffmpeg-antenna-v3/pyproject.toml
      - name: Static API-spine contract
        run: |
          python tools/remote_assistance_guard.py
          python tools/runtime_capability_guard.py
      - name: Install LuHm OS remote runtime
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pip install -e .
      - name: Deterministic routing benchmark
        run: python tools/remote_assistance_bench.py
      - name: Credential-safe OpenAI plus Hugging Face parallel smoke
        run: python tools/remote_ai_smoke.py | tee luhmos-remote-provider-smoke.json
      - name: Show API smoke report
        if: always()
        run: |
          test -f luhmos-remote-assistance-bench.json && cat luhmos-remote-assistance-bench.json || true
          test -f luhmos-remote-provider-smoke.json && cat luhmos-remote-provider-smoke.json || true
      - name: Upload API smoke reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-api-spine-smoke
          path: |
            luhmos-remote-assistance-bench.json
            luhmos-remote-provider-smoke.json
          if-no-files-found: ignore

  media-contract-smoke:
    name: Media contract smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SMOKE_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ultima/ollama-ffmpeg-antenna-v3/pyproject.toml
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install LuHm OS media runtime
        working-directory: ultima/ollama-ffmpeg-antenna-v3
        run: python -m pip install -e .
      - name: GitHub evidence plus OpenAI plus media pipeline smoke
        run: python tools/kai9000_remote_smoke.py --report kai9000-remote-smoke-report.json
      - name: Show media report
        if: always()
        run: test -f kai9000-remote-smoke-report.json && cat kai9000-remote-smoke-report.json || true
      - name: Upload media report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-media-contract-smoke
          path: kai9000-remote-smoke-report.json
          if-no-files-found: ignore
