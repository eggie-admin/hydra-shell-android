name: KAI9000 Antenna Gateway Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/antenna-gateway-smoke.yml'
      - 'ultima/ollama-ffmpeg-antenna-v3/gateway.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/magic_server.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/pyproject.toml'
      - 'ultima/ollama-ffmpeg-antenna-v3/.env.example'
      - 'ultima/ollama-ffmpeg-antenna-v3/lum_agent/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_gateway.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_lum_agent.py'

permissions:
  contents: read

concurrency:
  group: kai9000-antenna-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-smoke:
    name: Antenna + Lum contract Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ultima/ollama-ffmpeg-antenna-v3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install antenna runtime and test harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python - <<'PY'
          import importlib.metadata as m
          assert m.version('openai-agents') == '0.22.0'
          print('OPENAI_AGENTS_0_22_0_INSTALLED')
          PY

      - name: Compile antenna and Lum agent
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile gateway.py magic_server.py remote_ai.py main.py
          python -m compileall -q lum_agent tests/test_lum_agent.py
          echo 'ANTENNA_LUM_COMPILE_GREEN'

      - name: Run antenna and Lum doctrine tests
        shell: bash
        env:
          OPENAI_API_KEY: ''
          LUM_OPENAI_MODEL: gpt-5.6-luna
          LUM_OPENAI_TRACING: '0'
          KAI_GOOGLE_AUTH: auto
          GOOGLE_CLOUD_PROJECT: ''
          GCP_PROJECT: ''
          GCP_PROJECT_ID: ''
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_lum_agent.py \
            tests/test_gateway.py \
            tests/test_ci_smoke.py \
            tests/test_ci_magic.py
          echo 'ANTENNA_LUM_TESTS_GREEN'

      - name: Verify composed FastAPI application by behavior
        shell: bash
        env:
          OPENAI_API_KEY: ''
          LUM_OPENAI_MODEL: gpt-5.6-luna
          LUM_OPENAI_TRACING: '0'
          KAI_GOOGLE_AUTH: auto
          GOOGLE_CLOUD_PROJECT: ''
          GCP_PROJECT: ''
          GCP_PROJECT_ID: ''
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          import magic_server

          client = TestClient(magic_server.APP)
          assert client.get('/api/status').status_code == 200
          assert client.get('/providers/google/health').status_code == 200
          assert client.post('/api/providers/route', json={'kind': 'status', 'prefer': 'auto'}).status_code == 200
          assert client.post('/api/director', json={'message': 'smoke', 'mode': 'auto'}).status_code == 200
          assert client.post('/providers/google/generate', json={'prompt': 'smoke'}).status_code == 503
          assert client.get('/api/jobs').status_code == 200

          lum_status = client.get('/api/lum/status')
          assert lum_status.status_code == 200
          status = lum_status.json()
          assert status['agent'] == 'KAI9000-Lum-InApp'
          assert status['model'] == 'gpt-5.6-luna'
          assert status['credential_exposed_to_client'] is False
          assert status['self_approval'] is False
          lum_chat = client.post('/api/lum/chat', json={'message': 'Explain the Python doctrine'})
          assert lum_chat.status_code == 200
          assert lum_chat.json()['mode'] == 'deterministic_mock'

          with client.websocket_connect('/ws') as ws:
              assert ws.receive_json()['type'] == 'hello'
              ws.send_json({'type': 'ping'})
              assert ws.receive_json()['type'] == 'pong'

          with client.websocket_connect('/providers/gemini/live') as ws:
              event = ws.receive_json()
              assert event['type'] == 'provider.error'
              assert event['code'] == 'google_not_configured'

          print('ANTENNA_LUM_COMPOSED_APP_GREEN')
          PY

      - name: Seal smoke evidence
        shell: bash
        run: |
          cat <<'EOF'
          KAI9000_ANTENNA_LUM_SMOKE_GREEN
          /api/* -> HTTPS REST contract armed
          /ws -> Samsung control/status WebSocket armed
          /api/lum/* -> doctrine-driven OpenAI Agents SDK route armed
          Lum default model -> gpt-5.6-luna, reasoning none, verbosity low
          Lum mutation authority -> deterministic magic cast gateway; self-approval OFF
          Python skill chain -> doctrine/read/search/AST/compile/propose
          /providers/google/* -> Vertex ADC first; server credentials only
          /providers/gemini/live -> server-to-server Gemini Live bridge armed
          No live OpenAI or Google credential was used in this CI smoke.
          EOF
