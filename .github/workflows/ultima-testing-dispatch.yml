name: LuHm OS ULTIMA Testing Dispatch

on:
  push:
    branches:
      - luhmos/testing

permissions:
  contents: read
  actions: write

concurrency:
  group: ultima-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-ultima:
    name: Dispatch LuHm ULTIMA forge
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch LuHm forge against exact testing ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          ref = os.environ['TARGET_REF']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/luhmos-ultima-debug-apk.yml/dispatches'
          payload = json.dumps({'ref': ref}).encode('utf-8')
          req = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'luhmos-ultima-dispatch',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'workflow dispatch failed: HTTP {response.status}')
          print(f'LUHMOS_ULTIMA_DISPATCH_GREEN ref={ref}')
          PY
