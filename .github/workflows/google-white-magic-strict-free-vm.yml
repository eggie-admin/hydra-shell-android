name: Google White Magic - Strict Free VM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-white-magic-strict-free-vm
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and verify strict-free VM
    runs-on: ubuntu-24.04
    environment: testing
    steps:
      - name: Checkout Warp coordinates
        uses: actions/checkout@v7

      - name: Validate strict-free manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool integrations/google-cloud/strict-free-vm.manifest.json >/dev/null
          grep -q '"machine_type": "e2-micro"' integrations/google-cloud/strict-free-vm.manifest.json
          grep -q '"external_ipv4": false' integrations/google-cloud/strict-free-vm.manifest.json
          grep -q '"google_cloud_dns_enabled": false' integrations/google-cloud/strict-free-vm.manifest.json
          echo 'STRICT_FREE_MANIFEST_GREEN'

      - id: auth
        name: Cast WHITE_GATE through Google WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project '${{ vars.GCP_PROJECT_ID }}' >/dev/null
          gcloud projects describe '${{ vars.GCP_PROJECT_ID }}' --format='value(projectId)'

      - name: Cast FREE_VM
        shell: bash
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          GCP_ZONE: us-central1-a
          KAI_GCP_INSTANCE: kai9000-free
        run: |
          set -euo pipefail
          bash integrations/google-cloud/provision-strict-free-vm.sh | tee /tmp/kai9000-google-free-vm.txt
          grep -q 'WHITE_MAGIC_STRICT_FREE_STAGED' /tmp/kai9000-google-free-vm.txt

      - name: Final strict-free invariant
        shell: bash
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          MACHINE="$(gcloud compute instances describe kai9000-free --project="$GCP_PROJECT" --zone=us-central1-a --format='get(machineType.basename())')"
          IPV4="$(gcloud compute instances describe kai9000-free --project="$GCP_PROJECT" --zone=us-central1-a --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          IPV6="$(gcloud compute instances describe kai9000-free --project="$GCP_PROJECT" --zone=us-central1-a --format='get(networkInterfaces[0].ipv6AccessConfigs[0].externalIpv6)')"
          test "$MACHINE" = e2-micro
          test -z "$IPV4"
          test -n "$IPV6"
          printf 'WHITE_MAGIC_VM_PROVISIONED\nexternal_ipv6=%s\n' "$IPV6"

# Required repository variables:
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#
# The WIF principal must be constrained to this repository/workflow and granted
# only the permissions required to enable Compute Engine and manage the declared
# KAI VPC/subnet/firewall/VM resources. No service-account JSON key is used.
#
# DNS is intentionally NOT changed here. Apply the verified IPv6 to the
# Cloudflare Free DNS template using a separately scoped DNS token/capability.
