name: ULTIMA Final Form Gate

on:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/ultima-final-form.yml'
      - 'fdroid/publication.manifest.json'
      - 'integrations/cloudflare/security.manifest.json'
      - 'integrations/cloudflare/origin-ca-ecc.sh'
      - 'integrations/cloudflare/bootstrap-oauth.sh'
      - 'integrations/google-cloud/bootstrap-oauth.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ultima-final-form-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_ID: art.eggiebagelface.videoforge.dev
  FDROID_REPO_URL: https://fdroid.eggiebagelface.art/fdroid/repo/
  APK_SIGNER_SHA256: A5E9364D5C21A119FE1D17FD39EE7BAE8192A872CE58A3E7A865248E0B070407
  FDROID_REPO_FINGERPRINT_SHA256: BFB900A9EC913D35C22F1DC3DE7B152D1AF5CA11B7B07E5FAFDD06B44811F66D
  SIGNED_BUNDLE_SHA256: fa350eeb2a2945b3b0e664f459ae1706cd3c19d0c02913e799e7ea005c6f3028

jobs:
  final-form-preflight:
    name: Final-form signed evidence and OAuth bootstrap preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull Cloudflare public Origin CA ECC root
        shell: bash
        run: |
          set -euo pipefail
          bash integrations/cloudflare/origin-ca-ecc.sh pull-root
          test -s build/cloudflare-origin-ca/cloudflare-origin-ecc-root.pem
          echo 'CLOUDFLARE_PUBLIC_CA_GREEN'

      - name: Verify persistent signed publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('fdroid/publication.manifest.json').read_text())
          assert manifest['trust']['fdroid_signed'] is True
          assert manifest['trust']['apk_signer_sha256'] == os.environ['APK_SIGNER_SHA256']
          assert manifest['trust']['repo_fingerprint_sha256'] == os.environ['FDROID_REPO_FINGERPRINT_SHA256']
          assert manifest['signed_bundle']['sha256'] == os.environ['SIGNED_BUNDLE_SHA256']
          assert manifest['repo_url'] == os.environ['FDROID_REPO_URL']
          assert manifest['package_id'] == os.environ['PACKAGE_ID']
          assert manifest['origin']['human_auth'] == 'gcloud_user_oauth'
          assert manifest['edge']['human_auth'] == 'wrangler_and_cloudflared_oauth_browser_flows'
          print('PERSISTENT_SIGNED_EVIDENCE_GREEN')
          PY

      - name: Verify OAuth-first operator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash -n integrations/cloudflare/bootstrap-oauth.sh
          bash -n integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'login --device' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'cloudflared tunnel login' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'gcloud auth login --no-launch-browser' integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'cf_api_token_required_for_human_bootstrap' integrations/cloudflare/security.manifest.json
          echo 'OAUTH_OPERATOR_BOOTSTRAP_ARMED'

      - name: Confirm final publication tools are armed
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/publish_fdroid_origin.sh
          test -s integrations/google-cloud/nginx-fdroid-origin.conf
          test -s integrations/cloudflare/origin-ca-ecc.sh
          grep -q 'origin-ecc' integrations/cloudflare/origin-ca-ecc.sh
          grep -q 'ec_paramgen_curve:P-256' integrations/cloudflare/origin-ca-ecc.sh
          echo 'FINAL_FORM_OPERATOR_TOOLCHAIN_ARMED'

  final-form-ready:
    name: FINAL FORM operator publication armed
    needs: final-form-preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Seal operator-ready state
        run: |
          echo 'FINAL_FORM_OPERATOR_READY'
          echo 'No private signing key, Cloudflare API token, or Google WIF credential is required in GitHub for human publication.'
          echo 'Human bootstrap uses Cloudflare OAuth + gcloud OAuth. Durable CI may add scoped account tokens/WIF later.'
          echo 'FINAL_FORM_GREEN still requires live HTTPS publication, F-Droid import proof, and signed upgrade proof.'
