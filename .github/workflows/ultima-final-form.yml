name: ULTIMA Final Form Gate

on:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/ultima-final-form.yml'
      - 'fdroid/publication.manifest.json'
      - 'integrations/cloudflare/security.manifest.json'
      - 'integrations/cloudflare/dns-security.template.json'
      - 'integrations/cloudflare/cloudflared-fdroid-origin.template.yml'
      - 'integrations/cloudflare/bootstrap-oauth.sh'
      - 'integrations/google-cloud/bootstrap-oauth.sh'
      - 'integrations/google-cloud/provision-strict-free-vm.sh'
      - 'integrations/google-cloud/nginx-fdroid-origin.conf'
      - 'scripts/cast-ultima-live.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ultima-final-form-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_ID: art.eggiebagelface.videoforge.dev
  FDROID_REPO_URL: https://fdroid.eggiebagelface.art/fdroid/repo/
  APK_SIGNER_SHA256: A5E9364D5C21A119FE1D17FD39EE7BAE8192A872CE58A3E7A865248E0B070407
  FDROID_REPO_FINGERPRINT_SHA256: BFB900A9EC913D35C22F1DC3DE7B152D1AF5CA11B7B07E5FAFDD06B44811F66D
  SIGNED_BUNDLE_SHA256: fa350eeb2a2945b3b0e664f459ae1706cd3c19d0c02913e799e7ea005c6f3028

jobs:
  final-form-preflight:
    name: Final-form signed evidence and Tunnel publication preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify persistent signed publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('fdroid/publication.manifest.json').read_text())
          assert manifest['schema'] == 'kai9000.fdroid-publication.v3'
          assert manifest['trust']['fdroid_signed'] is True
          assert manifest['trust']['apk_signer_sha256'] == os.environ['APK_SIGNER_SHA256']
          assert manifest['trust']['repo_fingerprint_sha256'] == os.environ['FDROID_REPO_FINGERPRINT_SHA256']
          assert manifest['signed_bundle']['sha256'] == os.environ['SIGNED_BUNDLE_SHA256']
          assert manifest['repo_url'] == os.environ['FDROID_REPO_URL']
          assert manifest['package_id'] == os.environ['PACKAGE_ID']
          assert manifest['origin']['human_auth'] == 'gcloud_user_oauth'
          assert manifest['origin']['public_web_ingress'] is False
          assert manifest['origin']['public_ssh'] is False
          assert manifest['origin']['admin_transport'] == 'google_iap_ssh_only'
          assert manifest['edge']['human_auth'] == 'wrangler_and_cloudflared_oauth_browser_flows'
          assert manifest['edge']['route'] == 'dedicated_locally_managed_cloudflare_tunnel'
          assert manifest['edge']['origin_ip_exposed_in_dns'] is False
          assert manifest['live_cast']['script'] == 'scripts/cast-ultima-live.sh'
          print('PERSISTENT_SIGNED_TUNNEL_PUBLICATION_EVIDENCE_GREEN')
          PY

      - name: Verify OAuth-first operator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash -n integrations/cloudflare/bootstrap-oauth.sh
          bash -n integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'login --device' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'cloudflared tunnel login' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'gcloud auth login --no-launch-browser' integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'cf_api_token_required_for_human_bootstrap' integrations/cloudflare/security.manifest.json
          echo 'OAUTH_OPERATOR_BOOTSTRAP_ARMED'

      - name: Verify Tunnel-hidden Google origin doctrine
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool integrations/cloudflare/security.manifest.json >/dev/null
          python -m json.tool integrations/cloudflare/dns-security.template.json >/dev/null
          bash -n integrations/google-cloud/provision-strict-free-vm.sh
          test -s integrations/cloudflare/cloudflared-fdroid-origin.template.yml
          grep -q 'service: http://127.0.0.1:8080' integrations/cloudflare/cloudflared-fdroid-origin.template.yml
          grep -q '35.235.240.0/20' integrations/google-cloud/provision-strict-free-vm.sh
          grep -q 'tunnel-through-iap' integrations/google-cloud/provision-strict-free-vm.sh
          ! grep -Eq -- '--source-ranges[= ]+.*::/0' integrations/google-cloud/provision-strict-free-vm.sh
          ! grep -Eq 'listen[[:space:]]+\[::\]:(80|443)' integrations/google-cloud/nginx-fdroid-origin.conf
          grep -q 'listen 127.0.0.1:8080' integrations/google-cloud/nginx-fdroid-origin.conf
          echo 'TUNNEL_HIDDEN_ORIGIN_DOCTRINE_GREEN'

      - name: Verify live-cast script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/cast-ultima-live.sh
          grep -q 'cloudflared tunnel route dns' scripts/cast-ultima-live.sh
          grep -q 'gcloud compute scp' scripts/cast-ultima-live.sh
          grep -q -- '--tunnel-through-iap' scripts/cast-ultima-live.sh
          grep -q 'PERSISTENT_SIGNED_EVIDENCE_GREEN' scripts/cast-ultima-live.sh
          grep -q 'FDROID_PUBLISHED' scripts/cast-ultima-live.sh
          grep -q 'origin_public_ip_record=NONE' scripts/cast-ultima-live.sh
          echo 'ULTIMA_LIVE_CAST_SCRIPT_GREEN'

  final-form-ready:
    name: FINAL FORM live publication armed
    needs: final-form-preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Seal operator-ready state
        run: |
          echo 'FINAL_FORM_LIVE_PUBLICATION_ARMED'
          echo 'F-Droid origin is designed for a dedicated outbound-only Cloudflare Tunnel.'
          echo 'Google VM web ingress is closed; administration is Google IAP SSH only.'
          echo 'Human bootstrap uses Cloudflare OAuth + gcloud OAuth; no copied API token is required.'
          echo 'FINAL_FORM_GREEN still requires live HTTPS publication, F-Droid import proof, and signed upgrade proof.'
