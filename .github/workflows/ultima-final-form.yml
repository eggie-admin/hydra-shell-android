name: ULTIMA Final Form Gate

on:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/ultima-final-form.yml'
      - 'fdroid/publication.manifest.json'
      - 'integrations/cloudflare/security.manifest.json'
      - 'integrations/cloudflare/dns-security.template.json'
      - 'integrations/cloudflare/cloudflared-fdroid-origin.template.yml'
      - 'integrations/cloudflare/bootstrap-oauth.sh'
      - 'integrations/google-cloud/bootstrap-oauth.sh'
      - 'integrations/google-cloud/provision-strict-free-vm.sh'
      - 'integrations/google-cloud/nginx-fdroid-origin.conf'
      - 'scripts/cast-ultima-live.sh'
      - 'scripts/final-form-device-verify.sh'
      - 'ultima/ollama-ffmpeg-antenna-v3/gateway.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/magic_server.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/pyproject.toml'
      - 'ultima/ollama-ffmpeg-antenna-v3/lum_agent/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/static/index.html'
      - 'ultima/ollama-ffmpeg-antenna-v3/static/app.jquery.js'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_gateway.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_lum_agent.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ultima-final-form-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_ID: art.eggiebagelface.videoforge.dev
  FDROID_REPO_URL: https://fdroid.eggiebagelface.art/fdroid/repo/
  APK_SIGNER_SHA256: A5E9364D5C21A119FE1D17FD39EE7BAE8192A872CE58A3E7A865248E0B070407
  FDROID_REPO_FINGERPRINT_SHA256: BFB900A9EC913D35C22F1DC3DE7B152D1AF5CA11B7B07E5FAFDD06B44811F66D
  BASELINE_BUNDLE_SHA256: 703ba08ca4c030c5cf0a553ece8da8e910c3b48549f10bfe02b9feb4c938547d
  UPGRADE_BUNDLE_SHA256: 6cb100f525229e5d6445aa8f2dfb5f39b8895073efb278fc39f609cc64799b7d
  APK_V6_SHA256: 52bfcceed893a380def0c7ad472a81931ac39bed925c67830dee3d55f15efdbc
  APK_V7_SHA256: 11f88327d535f3af58815d6606d55475b81996e1ed5494d5ebd26d6bcf6ab283

jobs:
  final-form-preflight:
    name: Final-form signed evidence and Tunnel publication preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify persistent two-phase signed publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('fdroid/publication.manifest.json').read_text())
          assert manifest['schema'] == 'kai9000.fdroid-publication.v5'
          assert manifest['trust']['fdroid_signed'] is True
          assert manifest['trust']['apk_signer_sha256'] == os.environ['APK_SIGNER_SHA256']
          assert manifest['trust']['repo_fingerprint_sha256'] == os.environ['FDROID_REPO_FINGERPRINT_SHA256']
          assert manifest['trust']['apk_v2_signature_verified'] == [6, 7]
          assert manifest['repo_url'] == os.environ['FDROID_REPO_URL']
          assert manifest['package_id'] == os.environ['PACKAGE_ID']

          baseline = manifest['publication_phases']['baseline']
          upgrade = manifest['publication_phases']['upgrade']
          assert baseline['version_code'] == 6
          assert baseline['bundle_sha256'] == os.environ['BASELINE_BUNDLE_SHA256']
          assert upgrade['version_code'] == 7
          assert upgrade['bundle_sha256'] == os.environ['UPGRADE_BUNDLE_SHA256']
          assert manifest['apk_evidence']['6']['sha256'] == os.environ['APK_V6_SHA256']
          assert manifest['apk_evidence']['7']['sha256'] == os.environ['APK_V7_SHA256']
          assert manifest['apk_evidence']['6']['v2_signature_verified'] is True
          assert manifest['apk_evidence']['7']['v2_signature_verified'] is True

          assert manifest['origin']['human_auth'] == 'gcloud_user_oauth'
          assert manifest['origin']['public_web_ingress'] is False
          assert manifest['origin']['public_ssh'] is False
          assert manifest['origin']['admin_transport'] == 'google_iap_ssh_only'
          assert manifest['edge']['human_auth'] == 'wrangler_and_cloudflared_oauth_browser_flows'
          assert manifest['edge']['route'] == 'dedicated_locally_managed_cloudflare_tunnel'
          assert manifest['edge']['origin_ip_exposed_in_dns'] is False
          assert manifest['live_cast']['script'] == 'scripts/cast-ultima-live.sh'
          assert manifest['live_cast']['default_phase'] == 'baseline'
          assert manifest['final_sequence'][0] == 'publish baseline v6 bundle'
          assert manifest['final_sequence'][-1] == 'FINAL_FORM_GREEN'
          print('PERSISTENT_TWO_PHASE_PUBLICATION_EVIDENCE_GREEN')
          PY

      - name: Verify OAuth-first operator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash -n integrations/cloudflare/bootstrap-oauth.sh
          bash -n integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'login --device' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'cloudflared tunnel login' integrations/cloudflare/bootstrap-oauth.sh
          grep -q 'gcloud auth login --no-launch-browser' integrations/google-cloud/bootstrap-oauth.sh
          grep -q 'cf_api_token_required_for_human_bootstrap' integrations/cloudflare/security.manifest.json
          echo 'OAUTH_OPERATOR_BOOTSTRAP_ARMED'

      - name: Verify Tunnel-hidden Google origin doctrine
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool integrations/cloudflare/security.manifest.json >/dev/null
          python -m json.tool integrations/cloudflare/dns-security.template.json >/dev/null
          bash -n integrations/google-cloud/provision-strict-free-vm.sh
          test -s integrations/cloudflare/cloudflared-fdroid-origin.template.yml
          grep -q 'service: http://127.0.0.1:8080' integrations/cloudflare/cloudflared-fdroid-origin.template.yml
          grep -q '35.235.240.0/20' integrations/google-cloud/provision-strict-free-vm.sh
          grep -q 'tunnel-through-iap' integrations/google-cloud/provision-strict-free-vm.sh
          ! grep -Eq -- '--source-ranges[= ]+.*::/0' integrations/google-cloud/provision-strict-free-vm.sh
          ! grep -Eq 'listen[[:space:]]+\[::\]:(80|443)' integrations/google-cloud/nginx-fdroid-origin.conf
          grep -q 'listen 127.0.0.1:8080' integrations/google-cloud/nginx-fdroid-origin.conf
          echo 'TUNNEL_HIDDEN_ORIGIN_DOCTRINE_GREEN'

      - name: Verify two-phase live-cast script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/cast-ultima-live.sh
          grep -q -- '--phase baseline|upgrade' scripts/cast-ultima-live.sh
          grep -q 'KAI9000_FDROID_SIGNED_BASELINE_V6_20260907.zip' scripts/cast-ultima-live.sh
          grep -q 'KAI9000_FDROID_SIGNED_V6_V7_20260907.zip' scripts/cast-ultima-live.sh
          grep -q '703ba08ca4c030c5cf0a553ece8da8e910c3b48549f10bfe02b9feb4c938547d' scripts/cast-ultima-live.sh
          grep -q '6cb100f525229e5d6445aa8f2dfb5f39b8895073efb278fc39f609cc64799b7d' scripts/cast-ultima-live.sh
          grep -q 'cloudflared tunnel route dns' scripts/cast-ultima-live.sh
          grep -q 'gcloud compute scp' scripts/cast-ultima-live.sh
          grep -q -- '--tunnel-through-iap' scripts/cast-ultima-live.sh
          grep -q 'PERSISTENT_SIGNED_EVIDENCE_GREEN' scripts/cast-ultima-live.sh
          grep -q 'FDROID_BASELINE_V6_PUBLISHED' scripts/cast-ultima-live.sh
          grep -q 'FDROID_UPGRADE_V7_PUBLISHED' scripts/cast-ultima-live.sh
          grep -q 'origin_public_ip_record=NONE' scripts/cast-ultima-live.sh
          echo 'ULTIMA_TWO_PHASE_LIVE_CAST_GREEN'

      - name: Verify Samsung import and upgrade evidence gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final-form-device-verify.sh
          grep -q 'art.eggiebagelface.videoforge.dev' scripts/final-form-device-verify.sh
          grep -q 'BFB900A9EC913D35C22F1DC3DE7B152D1AF5CA11B7B07E5FAFDD06B44811F66D' scripts/final-form-device-verify.sh
          grep -q 'FDROID_IMPORT_VERIFIED' scripts/final-form-device-verify.sh
          grep -q 'UPGRADE_VERIFIED' scripts/final-form-device-verify.sh
          grep -q 'FINAL_FORM_GREEN' scripts/final-form-device-verify.sh
          echo 'SAMSUNG_FINAL_EVIDENCE_GATE_ARMED'

  antenna-lum-preflight:
    name: Antenna + Lum Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ultima/ollama-ffmpeg-antenna-v3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned antenna and Lum runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . pytest
          python - <<'PY'
          import importlib.metadata as m
          assert m.version('openai-agents') == '0.22.0'
          print('ULTIMA_OPENAI_AGENTS_PIN_GREEN')
          PY

      - name: Compile and exercise antenna plus Lum
        shell: bash
        env:
          OPENAI_API_KEY: ''
          LUM_OPENAI_MODEL: gpt-5.6-luna
          LUM_OPENAI_TRACING: '0'
          KAI_GOOGLE_AUTH: auto
          GOOGLE_CLOUD_PROJECT: ''
          GCP_PROJECT: ''
          GCP_PROJECT_ID: ''
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: |
          set -euo pipefail
          python -m py_compile gateway.py magic_server.py remote_ai.py main.py
          python -m compileall -q lum_agent tests/test_lum_agent.py
          python -m pytest -q tests/test_lum_agent.py tests/test_gateway.py tests/test_ci_smoke.py tests/test_ci_magic.py
          python - <<'PY'
          from fastapi.testclient import TestClient
          import magic_server

          client = TestClient(magic_server.APP)
          assert client.get('/api/status').status_code == 200
          assert client.get('/providers/google/health').status_code == 200
          assert client.post('/api/providers/route', json={'kind': 'status', 'prefer': 'auto'}).status_code == 200
          assert client.post('/api/director', json={'message': 'smoke', 'mode': 'auto'}).status_code == 200
          assert client.post('/providers/google/generate', json={'prompt': 'smoke'}).status_code == 503
          assert client.get('/api/jobs').status_code == 200

          lum = client.get('/api/lum/status')
          assert lum.status_code == 200
          status = lum.json()
          assert status['agent'] == 'KAI9000-Lum-InApp'
          assert status['model'] == 'gpt-5.6-luna'
          assert status['reasoning_effort'] == 'none'
          assert status['credential_exposed_to_client'] is False
          assert status['self_approval'] is False
          assert 'python-core' in status['skills']
          assert 'python-debug' in status['skills']
          chat = client.post('/api/lum/chat', json={'message': 'Explain Python class doctrine'})
          assert chat.status_code == 200
          assert chat.json()['mode'] == 'deterministic_mock'

          with client.websocket_connect('/ws') as ws:
              assert ws.receive_json()['type'] == 'hello'
              ws.send_json({'type': 'ping'})
              assert ws.receive_json()['type'] == 'pong'

          with client.websocket_connect('/providers/gemini/live') as ws:
              event = ws.receive_json()
              assert event['type'] == 'provider.error'
              assert event['code'] == 'google_not_configured'

          print('ULTIMA_ANTENNA_LUM_GREEN')
          PY

      - name: Verify server-only provider and approval doctrine
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'vertexai=True' gateway.py
          grep -q 'android_provider_credentials' gateway.py
          grep -q 'secrets_exposed' gateway.py
          grep -q 'blocked_pending_policy' gateway.py
          grep -q 'gpt-5.6-luna' lum_agent/agent.py
          grep -q 'reasoning.*none' lum_agent/agent.py
          grep -q 'self_approval.*False' lum_agent/router.py
          grep -q 'execution.*NOT_EXECUTED' lum_agent/tools.py
          grep -q 'human approval' lum_agent/skills/prime/SKILL.md
          ! grep -Eq 'sk-[A-Za-z0-9_-]{20,}' lum_agent .env.example static/index.html static/app.jquery.js
          ! grep -Eq 'AIza[0-9A-Za-z_-]{20,}' gateway.py .env.example
          echo 'ULTIMA_LUM_AUTHORITY_BOUNDARY_GREEN'

  final-form-ready:
    name: FINAL FORM two-phase live publication and Lum antenna armed
    needs: [final-form-preflight, antenna-lum-preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Seal operator-ready state
        run: |
          echo 'FINAL_FORM_TWO_PHASE_LIVE_PUBLICATION_ARMED'
          echo 'KAI9000_ANTENNA_GATEWAY_ARMED'
          echo 'KAI9000_LUM_AGENT_ARMED'
          echo 'Lum uses OpenAI Agents SDK 0.22.0 with gpt-5.6-luna, reasoning none, verbosity low.'
          echo 'Lum loads doctrine skills on demand and has read/search/AST/compile/proposal tools.'
          echo 'Lum cannot self-approve mutation; the deterministic magic cast gateway remains authoritative.'
          echo '/api/* REST, /ws control bus, /providers/google/* server adapter, and /providers/gemini/live are CI-proven.'
          echo 'Provider credentials remain server-side; no API key is embedded in Android/browser source.'
          echo 'Phase 1 publishes corrected persistent-signed versionCode 6 only.'
          echo 'After F-Droid import/install proves v6, phase 2 atomically publishes the v6+v7 repository.'
          echo 'FINAL_FORM_GREEN still requires a proven live Google VM, live HTTPS publication, F-Droid import/install proof, and on-device upgrade to versionCode 7.'
