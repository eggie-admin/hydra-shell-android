name: LuHm OpenAI Agent Mesh

on:
  push:
    branches:
      - luhmos/agent-mesh-1.0.9-20260916
    paths:
      - 'ultima/ollama-ffmpeg-antenna-v3/lum_agent/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_lum_agent.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/pyproject.toml'
      - '.github/workflows/luhmos-agent-mesh.yml'
  pull_request:
    branches:
      - luhmos-main
    paths:
      - 'ultima/ollama-ffmpeg-antenna-v3/lum_agent/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/tests/test_lum_agent.py'
      - 'ultima/ollama-ffmpeg-antenna-v3/pyproject.toml'
      - '.github/workflows/luhmos-agent-mesh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luhmos-agent-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-mesh:
    name: OpenAI SDK + Lum Boss Mesh
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ultima/ollama-ffmpeg-antenna-v3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install OpenAI agent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python - <<'PY'
          import importlib.metadata as m
          assert m.version('openai-agents') == '0.22.2'
          print('OPENAI_AGENTS_0_22_2_INSTALLED')
          PY
          python -m pip check

      - name: Compile focused mesh
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q lum_agent tests/test_lum_agent.py
          python - <<'PY'
          from lum_agent.mesh import MESH_SPEC, MAX_HELPERS_PER_TURN, HELPER_MAX_TURNS, build_boss_tools
          assert MESH_SPEC.topology == 'hub-and-spoke'
          assert MESH_SPEC.delegation_depth == 1
          assert MAX_HELPERS_PER_TURN <= 3
          assert HELPER_MAX_TURNS <= 4
          names={getattr(tool,'name','') for tool in build_boss_tools()}
          assert names == {'ask_context_blade','ask_build_blade','ask_critic_blade','propose_spell'}
          print('LUHM_BOSS_MESH_SOURCE_GREEN')
          PY

      - name: Run no-key deterministic tests
        shell: bash
        env:
          OPENAI_API_KEY: ''
          LUM_OPENAI_MODEL: gpt-5.6-luna
          LUM_HELPER_MODEL: gpt-5.6-luna
          LUM_OPENAI_TRACING: '0'
          LUM_AGENT_MAX_TURNS: '6'
          LUM_HELPER_MAX_TURNS: '2'
          LUM_MAX_HELPERS_PER_TURN: '2'
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_lum_agent.py
          echo 'LUHM_AGENT_MESH_DRY_RUN_GREEN'

      - name: Seal candidate contract
        shell: bash
        run: |
          cat <<'EOF'
          LUHM_OS_OPENAI_AGENT_MESH_CANDIDATE_GREEN
          sdk=openai-agents==0.22.2
          boss=KAI9000-Lum-Boss
          topology=hub-and-spoke
          delegation_depth=1
          max_helpers_per_turn=2
          helper_max_turns=2
          helpers=context,build,critic
          helper_recursion=OFF
          public_publish=OFF
          self_approval=OFF
          arbitrary_shell=OFF
          live_openai_call=NOT_RUN_IN_CI
          physical_termux_deploy=PENDING
          EOF
