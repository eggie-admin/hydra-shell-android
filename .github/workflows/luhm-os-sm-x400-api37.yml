name: LuHm OS Persistent Update Lane Forge

on:
  workflow_dispatch:
  push:
    branches:
      - build/luhm-update-lane-20260921
    paths:
      - 'samsung-sm-x400/luhm-os/**'
      - 'docs/CROWN_SOURCE_OF_TRUTH_20260920.json'
      - 'tools/luhm_sm_x400_android17_audit.py'
      - '.github/workflows/luhm-os-sm-x400-api37.yml'

permissions:
  contents: read

concurrency:
  group: luhm-update-lane-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: samsung-sm-x400/luhm-os
  PACKAGE_ID: art.eggiebagelface.kai9000.dev
  BASE_VERSION_NAME: 0.10.0-base
  BASE_VERSION_CODE: '1000'
  UPDATE_VERSION_NAME: 0.10.1-update
  UPDATE_VERSION_CODE: '1001'
  BASE_APK: luhm-os-base-unsigned.apk
  UPDATE_APK: luhm-os-update-unsigned.apk

jobs:
  forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Source, 3D, and update-lane audit
        run: python tools/luhm_sm_x400_android17_audit.py

      - name: Stage canonical Cathedral assets from Drive
        shell: bash
        run: |
          set -euo pipefail
          DEST="$APP_DIR/app/src/main/assets/cathedral"
          mkdir -p "$DEST" build
          : > build/canonical-assets.sha256
          fetch_drive() {
            local id="$1" name="$2" expected="$3"
            local out="$DEST/$name" tmp="$RUNNER_TEMP/$name"
            rm -f "$tmp" "$out"
            for url in \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              "https://drive.google.com/uc?export=download&id=${id}&confirm=t"; do
              if curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$url" --output "$tmp"; then
                if printf '%s  %s\n' "$expected" "$tmp" | sha256sum --check --status; then
                  mv "$tmp" "$out"
                  printf '%s  %s\n' "$expected" "$name" >> build/canonical-assets.sha256
                  return 0
                fi
              fi
              rm -f "$tmp"
            done
            echo "CANONICAL_DRIVE_ASSET_RED $name" >&2
            return 1
          }
          fetch_drive '1pd8Ow4bxcVg5vf0JIkIcdvzYURRhXujW' 'CURRENT_LUM_MIDNIGHT_1996_MODEL_SHEET.png' '60a84012d60965c3cfb02c2f94aaeca11401f0965c85595fc9ebcc79a0961ce0'
          fetch_drive '1gjrEfS1tK1YdRCpMB1QOqSXK0WQ2-_4z' 'CURRENT_KAI9000_GAME_WORLD_BIBLE.png' 'fe6cbd614e5078c21b7de4896eaff2c600329ab1cb969694d45669ad8b1c7175'
          fetch_drive '1efXJVIApFVvDmgL5_1Czju-XzpgI_-oL' 'CURRENT_KAI9000_CATHEDRAL_POSTER.png' '02a7b16dd88c6574d9f230c45335736fdebe9098002ea1fb42c7001497aaf794'
          fetch_drive '1yPhZgEeHPEhIe0ncDRhfuScKIvRpg0wo' 'CURRENT_LUM_ANIMATED_REEL.mp4' '1a20bd7bf495ee930d2cc9dab9342d7cb29d326ce0c7f433c206581ebdddad97'
          fetch_drive '1_6cgTXU2tgH15OZOuLmABGloKqhtfYJU' 'KAI9000_LUM_AVATAR_ACTUAL_ANIMATED.gif' 'a9df1d2b5c63d5740be8c476b59f389171b99609a14cd02fc8ae7568d27b2aba'
          fetch_drive '1Uq29nL8iM2hQn7hgLmzxcO7PC7_SC49L' 'KAI9000_LUM_AVATAR_ACTUAL_ANIMATED.manifest.json' '6b95f05e2532464022fa363c1d067755c3358600cfced0d791fd9fd7b95e2742'
          echo CATHEDRAL_DRIVE_CARGO_GREEN

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Canonical asset receipt
        working-directory: samsung-sm-x400/luhm-os/web
        run: npm run build

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.3.1'
          cache-cleanup: on-success

      - name: Bootstrap Android 17 preview SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-cli"
          curl --fail --silent --show-error --location https://dl.google.com/android/cli/latest/linux_x86_64/android --output "$RUNNER_TEMP/android-cli/android"
          chmod 0755 "$RUNNER_TEMP/android-cli/android"
          ANDROID_CLI="$RUNNER_TEMP/android-cli/android"
          "$ANDROID_CLI" --version | tee build-android-cli-version.txt
          "$ANDROID_CLI" --sdk="$ANDROID_HOME" sdk list 'platforms/android-37.*|build-tools/37.*|platform-tools' --all --all-versions --canary | tee build-android-sdk-catalog.txt
          grep -q 'platforms/android-37.0' build-android-sdk-catalog.txt
          "$ANDROID_CLI" --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar"
          test -f "$ANDROID_HOME/build-tools/37.0.0/lib64/libc++.so"
          echo ANDROID17_PREVIEW_SDK_BOOTSTRAP_GREEN

      - name: Build unsigned persistent-signer base
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$APP_DIR" --no-daemon --no-configuration-cache clean :app:assembleRelease \
            -PluhmVersionCode="$BASE_VERSION_CODE" \
            -PluhmVersionName="$BASE_VERSION_NAME"
          SRC="$APP_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          mkdir -p build/android build/signing-tools/lib build/signing-tools/lib64
          cp "$SRC" "build/android/$BASE_APK"

      - name: Build unsigned first update proof
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$APP_DIR" --no-daemon --no-configuration-cache clean :app:assembleRelease \
            -PluhmVersionCode="$UPDATE_VERSION_CODE" \
            -PluhmVersionName="$UPDATE_VERSION_NAME"
          SRC="$APP_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          cp "$SRC" "build/android/$UPDATE_APK"

      - name: Export and self-test portable private-signing tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          cp "$TOOLS/lib/apksigner.jar" build/signing-tools/lib/apksigner.jar
          cp "$TOOLS/lib64/libc++.so" build/signing-tools/lib64/libc++.so
          cp "$TOOLS/zipalign" build/signing-tools/zipalign
          cp "$TOOLS/aapt2" build/signing-tools/aapt2
          chmod 0755 build/signing-tools/zipalign build/signing-tools/aapt2
          cat > build/signing-tools/zipalign-portable <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/zipalign" "$@"
          EOF
          chmod 0755 build/signing-tools/zipalign-portable
          set +e
          build/signing-tools/zipalign-portable -h > build/signing-tools/zipalign-help.txt 2>&1
          rc=$?
          set -e
          grep -qiE 'zipalign|alignment|usage' build/signing-tools/zipalign-help.txt
          test "$rc" -eq 0 -o "$rc" -eq 1 -o "$rc" -eq 2
          java -jar build/signing-tools/lib/apksigner.jar version | tee build/signing-tools/apksigner-version.txt
          sha256sum \
            build/signing-tools/lib/apksigner.jar \
            build/signing-tools/lib64/libc++.so \
            build/signing-tools/zipalign \
            build/signing-tools/aapt2 \
            build/signing-tools/zipalign-portable \
            > build/signing-tools/sha256.txt
          echo PORTABLE_SIGNING_TOOLKIT_GREEN

      - name: Verify unsigned base/update lineage and Cathedral cargo
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          verify_unsigned() {
            local apk="$1" expected_code="$2" expected_name="$3" prefix="$4"
            if "$TOOLS/apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "PUBLIC_FORGE_SIGNED_APK_RED $apk" >&2
              exit 1
            fi
            "$TOOLS/zipalign" -c -P 16 -v 4 "$apk" > "build/android/${prefix}-zipalign.txt"
            "$TOOLS/aapt2" dump badging "$apk" > "build/android/${prefix}-badging.txt"
            unzip -l "$apk" > "build/android/${prefix}-contents.txt"
            sha256sum "$apk" > "build/android/${prefix}-sha256.txt"
            grep -q "package: name='$PACKAGE_ID' versionCode='$expected_code' versionName='$expected_name'" "build/android/${prefix}-badging.txt"
            grep -q "targetSdkVersion:'37'" "build/android/${prefix}-badging.txt"
            grep -q "application-label:'LuHm OS'" "build/android/${prefix}-badging.txt"
            grep -q 'assets/project.godot' "build/android/${prefix}-contents.txt"
            grep -q 'assets/main.tscn' "build/android/${prefix}-contents.txt"
            grep -q 'assets/main.gd' "build/android/${prefix}-contents.txt"
            grep -Eq 'lib/arm64-v8a/libgodot_android\.so' "build/android/${prefix}-contents.txt"
            if grep -Eqi 'lib/(armeabi-v7a|x86|x86_64)/libgodot_android\.so' "build/android/${prefix}-contents.txt;" then
              echo "NON_SM_X400_GODOT_ABI_RED $apk" >&2
              exit 1
            fi
          }
          verify_unsigned "build/android/$BASE_APK" "$BASE_VERSION_CODE" "$BASE_VERSION_NAME" base
          verify_unsigned "build/android/$UPDATE_APK" "$UPDATE_VERSION_CODE" "$UPDATE_VERSION_NAME" update
          test "$UPDATE_VERSION_CODE" -gt "$BASE_VERSION_CODE"
          check_asset() { local apk="$1" path="$2" expected="$3" got; got="$(unzip -p "$apk" "assets/$path" | sha256sum | awk '{print $1}')"; test "$got" = "$expected" || { echo "APK_ASSET_HASH_RED $path" >&2; exit 1; }; }
          for apk in "build/android/$BASE_APK" "build/android/$UPDATE_APK"; do
            check_asset "$apk" 'cathedral/CURRENT_LUM_MIDNIGHT_1996_MODEL_SHEET.png' '60a84012d60965c3cfb02c2f94aaeca11401f0965c85595fc9ebcc79a0961ce0'
            check_asset "$apk" 'cathedral/CURRENT_KAI9000_GAME_WORLD_BIBLE.png' 'fe6cbd614e5078c21b7de4896eaff2c600329ab1cb969694d45669ad8b1c7175'
            check_asset "$apk" 'cathedral/CURRENT_KAI9000_CATHEDRAL_POSTER.png' '02a7b16dd88c6574d9f230c45335736fdebe9098002ea1fb42c7001497aaf794'
            check_asset "$apk" 'cathedral/CURRENT_LUM_ANIMATED_REEL.mp4' '1a20bd7bf495ee930d2cc9dab9342d7cb29d326ce0c7f433c206581ebdddad97'
            check_asset "$apk" 'cathedral/KAI9000_LUM_AVATAR_ACTUAL_ANIMATED.gif' 'a9df1d2b5c63d5740be8c476b59f389171b99609a14cd02fc8ae7568d27b2aba'
            check_asset "$apk" 'cathedral/KAI9000_LUM_AVATAR_ACTUAL_ANIMATED.manifest.json' '6b95f05e2532464022fa363c1d067755c3358600cfced0d791fd9fd7b95e2742'
            check_asset "$apk" 'brand/icon.svg' 'fdc62c4d21922a3b2101d70d9400e3df598d1498baa36354b887afb4e2df1b57'
            check_asset "$apk" 'brand/logo-dark.svg' 'cdfda5be645e54b0925405dbd1169e56a919f17af20acaaabdf8d7a7a1da2a09'
            check_asset "$apk" 'brand/logo-light.svg' '83880741355c39fffd62dd804b6b8db576de7b7fc6ff514e89151811b9ff6010'
          done
          cat > build/android/update-lane-receipt.txt <<EOF
          LUHM_UPDATE_LANE_FORGE_GREEN
          PACKAGE_ID=$PACKAGE_ID
          BASE_VERSION_NAME=$BASE_VERSION_NAME
          BASE_VERSION_CODE=$BASE_VERSION_CODE
          UPDATE_VERSION_NAME=$UPDATE_VERSION_NAME
          UPDATE_VERSION_CODE=$UPDATE_VERSION_CODE
          PUBLIC_FORGE_SIGNING=UNSIGNED_ONLY
          PRIVATE_PERSISTENT_SIGNER_REQUIRED=true
          SAME_SIGNER_REQUIRED=true
          MONOTONIC_VERSION_CODE_REQUIRED=true
          PORTABLE_SIGNING_TOOLKIT_GREEN=true
          EOF
          echo LUHM_UPDATE_LANE_FORGE_GREEN
          echo PUBLIC_FORGE_SIGNING=UNSIGNED_ONLY
          echo PRIVATE_PERSISTENT_SIGNER_REQUIRED=true
          echo PORTABLE_SIGNING_TOOLKIT_GREEN=true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: luhm-os-persistent-update-lane-${{ github.run_number }}
          path: |
            build/android/${{ env.BASE_APK }}
            build/android/${{ env.UPDATE_APK }}
            build/android/base-sha256.txt
            build/android/base-badging.txt
            build/android/base-zipalign.txt
            build/android/base-contents.txt
            build/android/update-sha256.txt
            build/android/update-badging.txt
            build/android/update-zipalign.txt
            build/android/update-contents.txt
            build/android/update-lane-receipt.txt
            build/signing-tools/lib/apksigner.jar
            build/signing-tools/lib64/libc++.so
            build/signing-tools/zipalign
            build/signing-tools/zipalign-portable
            build/signing-tools/zipalign-help.txt
            build/signing-tools/aapt2
            build/signing-tools/apksigner-version.txt
            build/signing-tools/sha256.txt
            build/canonical-assets.sha256
            samsung-sm-x400/luhm-os/web-build-receipt.json
            samsung-sm-x400/luhm-os/app/src/main/assets/cathedral-assets.json
            samsung-sm-x400/luhm-os/app/src/main/assets/project.godot
            samsung-sm-x400/luhm-os/app/src/main/assets/main.tscn
            samsung-sm-x400/luhm-os/app/src/main/assets/main.gd
            build-android-cli-version.txt
            build-android-sdk-catalog.txt
          if-no-files-found: error
          retention-days: 7
