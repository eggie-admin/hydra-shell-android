name: KAI 9000 Finalize Proven Lock

on:
  push:
    branches:
      - testing/luhm-os-android
    paths:
      - '.github/workflows/kai9000-finalize-lock.yml'

permissions:
  contents: write

concurrency:
  group: kai9000-finalize-proven-lock
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout testing lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: testing/luhm-os-android
          persist-credentials: true

      - name: Repin donor and enforce proven npm lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          old_donor = '88be3ea5d9bcdecfcaf035b043cd112002dc06d7'
          new_donor = '06947ad9c0167bb28ac60f9281e3d348dbb6fe51'
          lock_sha = '7929d5c53793563492ff0f5b39278904ecfa5508b10071d5b6d4b0b268fe653c'

          workflow = Path('.github/workflows/oni-ultima-debug-apk.yml')
          text = workflow.read_text(encoding='utf-8')
          if old_donor not in text:
              raise SystemExit('Expected old donor pin not found')
          text = text.replace(old_donor, new_donor)

          old_cache = "key: ${{ runner.os }}-npm24-${{ hashFiles('_forge/vue-headless-cms/apps/package.json', '_forge/vue-headless-cms/apps/forge-ui/package.json') }}"
          new_cache = "key: ${{ runner.os }}-npm24-${{ hashFiles('_forge/vue-headless-cms/apps/package-lock.json') }}"
          if old_cache not in text:
              raise SystemExit('Expected npm cache key not found')
          text = text.replace(old_cache, new_cache, 1)

          old_block = """          npm install --global npm@12.0.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p \"$GITHUB_WORKSPACE/build/provenance\"
          sha256sum package-lock.json | tee \"$GITHUB_WORKSPACE/build/provenance/npm-package-lock.sha256\"
"""
          new_block = f"""          npm install --global npm@12.0.2 --no-audit --no-fund
          echo '{lock_sha}  package-lock.json' | sha256sum --check --strict
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p \"$GITHUB_WORKSPACE/build/provenance\"
          sha256sum package-lock.json | tee \"$GITHUB_WORKSPACE/build/provenance/npm-package-lock.sha256\"
"""
          if old_block not in text:
              raise SystemExit('Expected generated-lock build block not found')
          text = text.replace(old_block, new_block, 1)
          workflow.write_text(text, encoding='utf-8')

          manifest_path = Path('project/hydra/samsung/android/apk/testing-ingest.manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          samsung = manifest['external_references']['samsung_frontend']
          if samsung.get('commit') != old_donor:
              raise SystemExit('Manifest donor pin drifted unexpectedly')
          samsung['commit'] = new_donor
          samsung['npm_lock_sha256'] = lock_sha
          manifest['testing_toolchain']['npm_lock_sha256'] = lock_sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          grep -q 'DONOR_REF: 06947ad9c0167bb28ac60f9281e3d348dbb6fe51' .github/workflows/oni-ultima-debug-apk.yml
          grep -q '7929d5c53793563492ff0f5b39278904ecfa5508b10071d5b6d4b0b268fe653c' .github/workflows/oni-ultima-debug-apk.yml
          ! grep -q 'npm install --package-lock-only' .github/workflows/oni-ultima-debug-apk.yml
          python -m json.tool project/hydra/samsung/android/apk/testing-ingest.manifest.json >/dev/null

      - name: Self-delete finalizer and commit hardened state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KAI 9000 Forge'
          git config user.email '280515000+eggie-admin@users.noreply.github.com'
          git rm -- .github/workflows/kai9000-finalize-lock.yml
          git add -- .github/workflows/oni-ultima-debug-apk.yml project/hydra/samsung/android/apk/testing-ingest.manifest.json
          git diff --cached --check
          git commit -m 'Seal deterministic npm lock into APK forge'
          git push origin HEAD:testing/luhm-os-android
          echo 'KAI9000_LOCK_FINALIZED_GREEN'
