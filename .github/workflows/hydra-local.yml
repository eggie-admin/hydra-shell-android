name: LuHm OS Local CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/**'
      - 'tools/**'
      - '.github/workflows/hydra-local.yml'
  push:
    branches: [luhmos-main]
    paths:
      - 'backend/**'
      - 'ultima/ollama-ffmpeg-antenna-v3/**'
      - 'tools/**'
      - '.github/workflows/hydra-local.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest backend/tests -q
      - name: Syntax check compatibility launchers
        run: |
          bash -n tools/hydra-ollama-up.sh
          bash -n tools/hydra-full-green.sh
