name: LuHm OS ULTIMA In-App Updater APK

on:
  workflow_dispatch:
  push:
    branches:
      - luhmos/testing
    paths:
      - '.github/workflows/luhmos-ultima-adaptive-apk.yml'
      - 'project/hydra/LUHMOS_REPO_CONVERGENCE_20260910.json'

permissions:
  contents: read

concurrency:
  group: luhmos-inapp-updater-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: 78d7714f585c81b6d476bd7192b840655f9be375
  PACKAGE_ID: art.eggiebagelface.luhmos
  VERSION_NAME: '1.0.1'
  VERSION_CODE: '101'
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  ANDROID_GRADLE_VERSION: 8.11.1
  ANDROID_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
  APK_NAME: luhmos-1.0.1-inapp-updater-debug.apk

jobs:
  updater-forge:
    name: LuHm guarded in-app updater forge
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout LuHm OS source of truth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned updater donor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/luhmos-android
          persist-credentials: false

      - name: Verify LuHm identity display and updater contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          convergence = json.loads(Path('project/hydra/LUHMOS_REPO_CONVERGENCE_20260910.json').read_text(encoding='utf-8'))
          donor = next(item for item in convergence['repositories'] if item['repository'] == 'eggie-admin/vue-headless-cms')
          assert donor['ref'] == '78d7714f585c81b6d476bd7192b840655f9be375'
          assert donor['branch'] == 'luhmos/inapp-updater-v1'
          assert convergence['canonical']['android_application_id'] == 'art.eggiebagelface.luhmos'

          display = convergence['display_contract']
          assert display['identity'] == 'LuHm OS'
          assert display['design_space_portrait'] == '1080x1920'
          assert display['orientation'] == 'sensor'
          assert display['runtime_resolution_owner'] == 'android_system_window'
          assert display['headless_policy'] == 'display_bridge_noop_and_ci_smoke'

          update = convergence['update_contract']
          assert update['transport'] == 'https_only'
          assert update['android_installer'] == 'PackageInstaller_session'
          assert update['package_lock'] == 'art.eggiebagelface.luhmos'
          assert update['signer_lock'] == 'must_match_installed_app'
          assert update['downgrade_policy'] == 'reject'
          assert update['silent_install'] is False
          assert update['persistent_signing_required_for_real_updates'] is True

          root = Path('_forge/luhmos-android')
          version = json.loads((root / 'release/version.json').read_text(encoding='utf-8'))
          assert version['packageId'] == 'art.eggiebagelface.luhmos'
          assert version['version'] == '1.0.1'
          assert version['versionCode'] == 101
          PY

          PROJECT='_forge/luhmos-android/godot/project.godot'
          DISPLAY='_forge/luhmos-android/godot/scripts/system_display.gd'
          SMOKE='_forge/luhmos-android/godot/scripts/headless_smoke.gd'
          PRESET='_forge/luhmos-android/godot/export_presets.cfg'
          MANIFEST='_forge/luhmos-android/godot/android-plugin/plugin/src/main/AndroidManifest.xml'
          PLUGIN='_forge/luhmos-android/godot/android-plugin/plugin/src/main/java/art/eggiebagelface/cathedral/CathedralAndroidPlugin.kt'
          UI='_forge/luhmos-android/apps/forge-ui/src/App.vue'

          for f in "$PROJECT" "$DISPLAY" "$SMOKE" "$PRESET" "$MANIFEST" "$PLUGIN" "$UI"; do test -s "$f"; done
          grep -q 'config/name="LuHm OS"' "$PROJECT"
          grep -q 'size/viewport_width=1080' "$PROJECT"
          grep -q 'size/viewport_height=1920' "$PROJECT"
          grep -q 'handheld/orientation=6' "$PROJECT"
          grep -q 'stretch/mode="canvas_items"' "$PROJECT"
          grep -q 'stretch/aspect="expand"' "$PROJECT"
          grep -q 'DisplayServer.screen_set_orientation(DisplayServer.SCREEN_SENSOR)' "$DISPLAY"
          grep -q 'DisplayServer.get_display_safe_area()' "$DISPLAY"
          grep -q 'DisplayServer.get_name() == "headless"' "$DISPLAY"
          grep -q 'LUHMOS_HEADLESS_GODOT_GREEN' "$SMOKE"

          grep -q 'version/code=101' "$PRESET"
          grep -q 'version/name="1.0.1"' "$PRESET"
          grep -q 'package/unique_name="art.eggiebagelface.luhmos"' "$PRESET"
          grep -q 'gradle_build/target_sdk="36"' "$PRESET"
          grep -q 'architectures/arm64-v8a=true' "$PRESET"

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -q 'CathedralUpdateReceiver' "$MANIFEST"
          grep -q 'android:exported="false"' "$MANIFEST"
          grep -q 'PackageInstaller.SessionParams' "$PLUGIN"
          grep -q 'Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES' "$PLUGIN"
          grep -q 'archive.packageName != context.packageName' "$PLUGIN"
          grep -q 'signing certificate does not match installed LuHm OS' "$PLUGIN"
          grep -q 'Rejected downgrade' "$PLUGIN"
          grep -q 'app.update.install' "$PLUGIN"
          grep -q 'Install / Update APK' "$UI"
          grep -q 'https:\\/\\/' "$UI"
          echo 'LUHMOS_INAPP_UPDATER_SOURCE_GREEN'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/luhmos/godot-4.7.2"
          WORK="$RUNNER_TEMP/luhmos-godot"
          mkdir -p "$CACHE" "$WORK"

          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict

          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/export_templates.tpz" | sha256sum --check --strict

          GRADLE_ZIP="$CACHE/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 5 --retry-all-errors -o "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          echo "${ANDROID_GRADLE_SHA256}  $GRADLE_ZIP" | sha256sum --check --strict

          unzip -q -o "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          mkdir -p "$WORK/templates"
          unzip -q -o "$CACHE/export_templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"

          PATCH_DIR="$WORK/android-source-patched"
          mkdir -p "$PATCH_DIR"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH_DIR"
          WRAPPER_PROPS="$(find "$PATCH_DIR" -type f -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          test -n "$WRAPPER_PROPS"
          python - "$WRAPPER_PROPS" "$GRADLE_ZIP" "$ANDROID_GRADLE_SHA256" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          uri = Path(sys.argv[2]).resolve().as_uri()
          digest = sys.argv[3]
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          saw_sha = False
          for line in lines:
              if line.startswith('distributionUrl='):
                  out.append(f'distributionUrl={uri}')
              elif line.startswith('distributionSha256Sum='):
                  out.append(f'distributionSha256Sum={digest}')
                  saw_sha = True
              else:
                  out.append(line)
          if not saw_sha:
              out.append(f'distributionSha256Sum={digest}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          (cd "$PATCH_DIR" && zip -q -r "$TEMPLATE_DIR/android_source.zip.new" .)
          mv "$TEMPLATE_DIR/android_source.zip.new" "$TEMPLATE_DIR/android_source.zip"

      - name: Build bundled Vue cockpit
        working-directory: _forge/luhmos-android/apps
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace=video-forge-ui
          test -s forge-ui/dist/index.html
          grep -q 'Install / Update APK' forge-ui/dist/assets/*.js

      - name: Build Godot Android plugin
        working-directory: _forge/luhmos-android
        run: |
          set -euo pipefail
          rm -rf godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p godot/android-plugin/plugin/src/main/assets/cms
          cp -a apps/forge-ui/dist/. godot/android-plugin/plugin/src/main/assets/cms/
          gradle -p godot/android-plugin :plugin:assemble
          test -s godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar
          test -s godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar
          rm -rf godot/addons/CathedralAndroid
          mkdir -p godot/addons/CathedralAndroid/bin/debug godot/addons/CathedralAndroid/bin/release
          cp -a godot/android-plugin/plugin/export_scripts_template/. godot/addons/CathedralAndroid/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar godot/addons/CathedralAndroid/bin/debug/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar godot/addons/CathedralAndroid/bin/release/

      - name: Configure ephemeral testing signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          KEYSTORE="$RUNNER_TEMP/luhmos-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=LuHm OS Updater Testing,O=Eggie Bagelface Art,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'EPHEMERAL_SIGNER_TEST_ONLY=1' >> "$GITHUB_ENV"

      - name: Godot headless import and adaptive smoke
        working-directory: _forge/luhmos-android
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path godot --quit
          "$GODOT_BIN" --headless --path godot --script res://scripts/headless_smoke.gd | tee "$GITHUB_WORKSPACE/build/android/headless-smoke.txt"
          grep -q 'LUHMOS_HEADLESS_GODOT_GREEN' "$GITHUB_WORKSPACE/build/android/headless-smoke.txt"
          echo 'LUHMOS_HEADLESS_GATE_GREEN'

      - name: Export in-app updater Android testing APK
        working-directory: _forge/luhmos-android
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot \
            --install-android-build-template \
            --export-debug 'Android Release' \
            "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          test -s "$GITHUB_WORKSPACE/build/android/$APK_NAME"

      - name: Verify updater APK identity signature alignment and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee build/android/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build/android/badging.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | tee build/android/manifest.txt
          unzip -l "$APK" | tee build/android/contents.txt
          sha256sum "$APK" | tee build/android/sha256.txt

          grep -q "package: name='${PACKAGE_ID}'" build/android/badging.txt
          grep -q "versionCode='${VERSION_CODE}'" build/android/badging.txt
          grep -q "versionName='${VERSION_NAME}'" build/android/badging.txt
          grep -q "application-label:'LuHm OS'" build/android/badging.txt
          grep -q "targetSdkVersion:'36'" build/android/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/android/badging.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' build/android/manifest.txt
          grep -q 'CathedralUpdateReceiver' build/android/manifest.txt
          grep -q 'assets/cms/index.html' build/android/contents.txt
          grep -q 'system_display.gdc' build/android/contents.txt || grep -q 'system_display.gd' build/android/contents.txt
          grep -Eq 'Verified using v(2|3|4) scheme .*: true' build/android/signature.txt
          echo 'LUHMOS_INAPP_UPDATER_APK_GREEN'

      - name: Write testing-signature limitation evidence
        shell: bash
        run: |
          cat > build/android/UPDATE_SIGNING_GATE.txt <<'EOF'
          This APK proves the in-app updater compiles and packages correctly.
          The CI signer for this testing lane is ephemeral and changes between runs.
          Android updates require the same signing identity across installed and replacement APKs.
          Therefore real cross-build self-update remains gated on the persistent LuHm OS signing secrets.
          EOF

      - name: Upload ULTIMA updater APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-inapp-updater-ultima-${{ github.run_number }}
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/manifest.txt
            build/android/contents.txt
            build/android/headless-smoke.txt
            build/android/UPDATE_SIGNING_GATE.txt
          if-no-files-found: error
          retention-days: 14

  ultima-green:
    name: LuHm in-app updater ULTIMA final gate
    needs: [updater-forge]
    runs-on: ubuntu-24.04
    steps:
      - name: Seal updater compile green
        run: |
          set -euo pipefail
          test '${{ needs.updater-forge.result }}' = success
          echo 'LUHMOS_INAPP_UPDATER_ULTIMA_GREEN'
