name: LuHm Crown Gate APK

on:
  push:
    branches:
      - luhmos-main
    paths:
      - 'project/hydra/samsung/android/cathedral-game/**'
      - '.github/workflows/luhmos-crown-gate-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luhmos-world-first-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR_REPO: eggie-admin/vue-headless-cms
  DONOR_REF: 96c23c87713800fc17c80b6a972ee2e93f1bb4b1
  PACKAGE_ID: art.eggiebagelface.luhmos
  VERSION_NAME: '1.0.7'
  VERSION_CODE: '107'
  PREVIOUS_VERSION_CODE: '106'
  APK_NAME: luhmos-world-first-1.0.7.apk
  KEY_ALIAS: luhmos-release
  EXPECTED_SIGNER_SHA256: 598d7272d62dbebb71972d6164822636ad1439cd35631d0cd43321d003c92142
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  ANDROID_GRADLE_VERSION: 8.11.1
  ANDROID_GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

jobs:
  crown-gate:
    name: Signed World-First Godot Update
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout LuHm OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout hardened Android forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.DONOR_REPO }}
          ref: ${{ env.DONOR_REF }}
          path: _forge/luhmos-android
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: World-first source contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='project/hydra/samsung/android/cathedral-game/godot-world-first'
          test -f "$ROOT/world_first.tscn"
          test -f "$ROOT/world_first.gd"
          test -f "$ROOT/README.md"
          grep -q 'CanvasLayer' "$ROOT/world_first.tscn"
          grep -q 'LumBubble' "$ROOT/world_first.tscn"
          grep -q 'CockpitOverlay' "$ROOT/world_first.tscn"
          grep -q 'visible = false' "$ROOT/world_first.tscn"
          grep -q 'GAME ≠ ADMIN' "$ROOT/world_first.tscn"
          grep -q 'No shell, no network, no privilege bridge' "$ROOT/world_first.gd"
          ! grep -R -nE '\b(OS\.execute|JavaScriptBridge|HTTPRequest|WebSocketPeer)\b' "$ROOT"
          echo 'LUHM_OS_GODOT_WORLD_FIRST_SOURCE_GREEN'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/luhmos/godot-4.7.2"
          WORK="$RUNNER_TEMP/luhmos-godot"
          mkdir -p "$CACHE" "$WORK"
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/export_templates.tpz" | sha256sum --check --strict
          GRADLE_ZIP="$CACHE/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 5 --retry-all-errors -o "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${ANDROID_GRADLE_VERSION}-bin.zip"
          echo "${ANDROID_GRADLE_SHA256}  $GRADLE_ZIP" | sha256sum --check --strict
          unzip -q -o "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          rm -rf "$WORK/templates" && mkdir -p "$WORK/templates"
          unzip -q "$CACHE/export_templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          PATCH_DIR="$WORK/android-source-patched"
          rm -rf "$PATCH_DIR" && mkdir -p "$PATCH_DIR"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PATCH_DIR"
          WRAPPER_PROPS="$(find "$PATCH_DIR" -type f -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)"
          test -n "$WRAPPER_PROPS"
          python3 - "$WRAPPER_PROPS" "$GRADLE_ZIP" "$ANDROID_GRADLE_SHA256" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); uri=Path(sys.argv[2]).resolve().as_uri(); digest=sys.argv[3]
          lines=p.read_text().splitlines(); out=[]; saw=False
          for line in lines:
              if line.startswith('distributionUrl='):
                  out.append('distributionUrl='+uri); saw=True
              elif line.startswith('distributionSha256Sum='):
                  out.append('distributionSha256Sum='+digest)
              else:
                  out.append(line)
          if not saw: raise SystemExit('missing gradle wrapper URL')
          if not any(x.startswith('distributionSha256Sum=') for x in out): out.append('distributionSha256Sum='+digest)
          p.write_text('\n'.join(out)+'\n')
          PY
          (cd "$PATCH_DIR" && zip -q -r "$TEMPLATE_DIR/android_source.zip.new" .)
          mv "$TEMPLATE_DIR/android_source.zip.new" "$TEMPLATE_DIR/android_source.zip"

      - name: Compose Godot world-first runtime
        shell: bash
        run: |
          set -euo pipefail
          GAME="$GITHUB_WORKSPACE/project/hydra/samsung/android/cathedral-game"
          WORLD="$GAME/godot-world-first"
          PROJECT='_forge/luhmos-android/godot/project.godot'
          PRESET='_forge/luhmos-android/godot/export_presets.cfg'
          DEST='_forge/luhmos-android/godot/luhm/world-first'
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp "$WORLD/world_first.tscn" "$DEST/world_first.tscn"
          cp "$WORLD/world_first.gd" "$DEST/world_first.gd"

          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'(?m)^config/name="[^"]*"$', 'config/name="LuHm OS"', t, count=1)
          t=re.sub(r'(?m)^run/main_scene="[^"]*"$', 'run/main_scene="res://luhm/world-first/world_first.tscn"', t, count=1)
          t=re.sub(r'(?m)^size/viewport_width=\d+$', 'size/viewport_width=1080', t, count=1)
          t=re.sub(r'(?m)^size/viewport_height=\d+$', 'size/viewport_height=1920', t, count=1)
          if 'handheld/orientation=' in t:
              t=re.sub(r'(?m)^handheld/orientation=\d+$','handheld/orientation=1',t,count=1)
          else:
              t=t.replace('size/viewport_height=1920\n','size/viewport_height=1920\nhandheld/orientation=1\n',1)
          if 'stretch/aspect=' not in t:
              t=t.replace('stretch/mode="canvas_items"\n','stretch/mode="canvas_items"\nstretch/aspect="expand"\n',1)
          p.write_text(t)
          PY
          grep -q 'run/main_scene="res://luhm/world-first/world_first.tscn"' "$PROJECT"

          rm -rf _forge/luhmos-android/godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p _forge/luhmos-android/godot/android-plugin/plugin/src/main/assets/cms
          cp -a "$GAME"/. _forge/luhmos-android/godot/android-plugin/plugin/src/main/assets/cms/

          python3 - "$PRESET" "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); code,name=sys.argv[2],sys.argv[3]; t=p.read_text()
          t=re.sub(r'(?m)^version/code=\d+$',f'version/code={code}',t)
          t=re.sub(r'(?m)^version/name="[^"]*"$',f'version/name="{name}"',t)
          t=re.sub(r'(?m)^export_path="[^"]*"$',f'export_path="../build/android/luhmos-{name}.apk"',t,count=1)
          t=re.sub(r'(?m)^gradle_build/min_sdk="[^"]*"$','gradle_build/min_sdk="24"',t)
          t=re.sub(r'(?m)^gradle_build/target_sdk="[^"]*"$','gradle_build/target_sdk="36"',t)
          p.write_text(t)
          PY
          test "$VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE"
          gradle -p _forge/luhmos-android/godot/android-plugin :plugin:assemble
          rm -rf _forge/luhmos-android/godot/addons/CathedralAndroid
          mkdir -p _forge/luhmos-android/godot/addons/CathedralAndroid/bin/debug _forge/luhmos-android/godot/addons/CathedralAndroid/bin/release
          cp -a _forge/luhmos-android/godot/android-plugin/plugin/export_scripts_template/. _forge/luhmos-android/godot/addons/CathedralAndroid/
          cp _forge/luhmos-android/godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar _forge/luhmos-android/godot/addons/CathedralAndroid/bin/debug/
          cp _forge/luhmos-android/godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar _forge/luhmos-android/godot/addons/CathedralAndroid/bin/release/

      - name: Parse world-first Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path _forge/luhmos-android/godot --quit
          echo 'LUHM_OS_GODOT_WORLD_FIRST_PARSE_GREEN'

      - name: Restore persistent release signer
        shell: bash
        env:
          ANDROID_KS_B64: ${{ secrets.LUHMOS_ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_PASS: ${{ secrets.LUHMOS_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASS: ${{ secrets.LUHMOS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KS_B64" && test -n "$ANDROID_KS_PASS" && test -n "$ANDROID_KEY_PASS"
          test "$ANDROID_KS_PASS" = "$ANDROID_KEY_PASS"
          ANDROID_KS="$RUNNER_TEMP/luhmos-release.keystore"
          printf '%s' "$ANDROID_KS_B64" | base64 --decode > "$ANDROID_KS"
          chmod 600 "$ANDROID_KS"
          keytool -list -keystore "$ANDROID_KS" -storepass "$ANDROID_KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ANDROID_KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KS_PASS" >> "$GITHUB_ENV"

      - name: Export signed world-first APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/release
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          "$GODOT_BIN" --headless --path _forge/luhmos-android/godot \
            --install-android-build-template \
            --export-release 'Android Release' \
            "$GITHUB_WORKSPACE/build/release/$APK_NAME"
          test -s "build/release/$APK_NAME"

      - name: Verify 1.0.7 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/release/$APK_NAME"
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee build/release/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > build/release/zipalign.txt
          "$BT/aapt" dump badging "$APK" | tee build/release/badging.txt
          "$BT/aapt" dump permissions "$APK" > build/release/permissions.txt
          unzip -l "$APK" > build/release/contents.txt
          sha256sum "$APK" | tee build/release/sha256.txt
          grep -q "package: name='${PACKAGE_ID}'" build/release/badging.txt
          grep -q "versionCode='${VERSION_CODE}'" build/release/badging.txt
          grep -q "versionName='${VERSION_NAME}'" build/release/badging.txt
          grep -q "sdkVersion:'24'" build/release/badging.txt
          grep -q "targetSdkVersion:'36'" build/release/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/release/badging.txt
          ! grep -q 'com.termux' build/release/permissions.txt
          grep -Eq 'Verified using v(2|3|4) scheme .*: true' build/release/signature.txt
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/release/signature.txt | head -n1 > build/release/apk-signer-sha256.txt
          test "$(cat build/release/apk-signer-sha256.txt)" = "$EXPECTED_SIGNER_SHA256"
          cat > build/release/CROWN_GATE_RECEIPT.txt <<EOF
          LUHM_OS_GODOT_WORLD_FIRST_HUD_BUILD_GREEN
          version=${VERSION_NAME}/${VERSION_CODE}
          previous_version_code=${PREVIOUS_VERSION_CODE}
          package=${PACKAGE_ID}
          signer_sha256=${EXPECTED_SIGNER_SHA256}
          main_scene=res://luhm/world-first/world_first.tscn
          game_world_first=true
          lum_floating_hud=true
          cockpit_default_visible=false
          public_publish=OFF
          silent_install=false
          physical_device_proof=pending
          EOF
          echo 'LUHM_OS_GODOT_WORLD_FIRST_APK_GREEN'

      - name: Upload signed world-first APK and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhmos-world-first-${{ env.VERSION_NAME }}
          path: |
            build/release/${{ env.APK_NAME }}
            build/release/sha256.txt
            build/release/signature.txt
            build/release/badging.txt
            build/release/permissions.txt
            build/release/contents.txt
            build/release/zipalign.txt
            build/release/apk-signer-sha256.txt
            build/release/CROWN_GATE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 30
