[project]
name = "kai9000-ultima-ollama-ffmpeg-antenna"
version = "3.3.0"
description = "KAI 9000 jQuery cockpit with Python3/FastAPI magic coding, local Ollama, FFmpeg, and Google/Gemini antenna gateway"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "google-genai",
]

[tool.setuptools]
packages = ["ai_feed"]
py-modules = [
  "antenna",
  "comfy_batch",
  "doctor",
  "drive_backup",
  "gateway",
  "magic_chat",
  "magic_server",
  "main",
  "remote_ai",
  "remote_pull",
]
